# Start patch for new master modules

# This patch is loaded to every new master module that leaves our labs.
# It outputs various modulation voltages at the outputs O1 through O8.
# The inputs I1 and I2 are used as triggers. No controllers are needed.

# OUTPUTS:
# O1: [Triangle] Bipolar triangle LFO running hat 2 Hz, from -1V to +1V
# O2: [Sine] Bipolar sine LFO at 1 Hz, from -5V to +5V
# O3: [Ramp] LFO with slow rising ramp needing 60 seconds from 0V to 4V
# O4: [Clock] Square wave LFO (clock) running at 8 HZ, at 0V / 10V
# O5: [AR] Attack/Release - envelope triggered with I1
# O6: [ADSR] ADSR-enveloped triggered with I1
# O7: [Random] stepped random voltages in the range 0V ... 5V, triggered with I2
# O8: [Arp] C minor triad arpeggio pitches from 0V to 2V, triggered with I2

# INPUTS:
# I1: [Gate] Gates for the two envelopes at O5 and O6
# I2: [Clock] Clock for random voltages and arpeggio on O7 and O8

[lfo]
    bipolar = 1
    level = 1V
    hz = 2
    triangle = O1

[lfo]
    bipolar = 1
    level = 5V
    hz = 1
    sine = O2

[lfo]
    hz = 1/60
    level = 4V
    sawtooth = O3

[lfo]
    hz = 8
    square = O4

[contour]
    attack = 0.5
    release = 0.5
    trigger = I1
    output = O5

[contour]
    attack = 0.1
    decay = 0.3
    sustain = 0.5
    release = 1.0
    trigger = I1
    output = O6

[random]
    clock = I2
    output = O7
    minimum = 0V
    maximum = 5V

[arpeggio]
    clock = I2
    root = 0
    degree = 6 # minor
    range = 2V
    select1 = 1
    select3 = 1
    select5 = 1
    output = O8
