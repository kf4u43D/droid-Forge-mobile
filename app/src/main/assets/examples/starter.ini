# Premier patch AndroForge
# LABELS: master=18; firmware=blue-7
# I1: [CLOCK] Horloge externe facultative
# O1: [LFO] Modulation sinusoïdale
# O2: [ATTEN] Entrée atténuée

[p2b8]

# Modulation lente
[lfo]
    hz = 1
    level = P1.1
    sine = O1

# Atténuateur
[copy]
    input = I1 * 0.5
    output = O2
