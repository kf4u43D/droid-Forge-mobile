# (A) Drum sequencer

# 

# INPUTS:
#  I1: [Clock]
#  I2: [Reset]

# OUTPUTS:
#  O1: [Frq mod] Frequency shifter modulation
#  O3: [PC Lvl]
#  O4: [Duck]
#  O5: [HH Acc]
#  O6: [SD Velo] SD Velocity
#  O7: [PC Trig]
#  O8: [PC BW] PC Bandwidth

# GATES ON MODULE 1:
#  G1.1: [BD Trig]
#  G1.2: [BD Acc]
#  G1.3: [SD Trig]
#  G1.4: [HC Trig]
#  G1.5: [HO Trigg]
#  G1.6: [M Clk]
#  G1.7: [CL Trig]

# CONTROLLER 1:
#  P1.1: [Morphs]
#  P1.2: [Activity]
#  B1.1: [BD]
#  B1.2: [Alt]
#  B1.3: [SD]
#  B1.4: [Alt 2|4]
#  B1.5: [HH]
#  B1.6: [Length]
#  B1.7: [CL]
#  B1.8: [Accent]

# CONTROLLER 2:
#  P2.1: [PC Level anim] Animation for the level of the PC voice
#  P2.2: [PC Bandwid anim] Animation of the bandwidth of the PC voice (same source as P2.1)
#  B2.1: [DB Fills]
#  B2.2: [Ducking] Choose to use either DB trigger or clock/4
#  B2.3: [DB Rolls]
#  B2.4: [SD->CL]
#  B2.5: [HH x2]
#  B2.6: [PC BW] If on the bandwidth for the PC voice is randomized, otherwise (off) it's determined by the accents
#  B2.7: [M 2|4|6]
#  B2.8: [PC]

# CONTROLLER 3:
#  P3.1: [Dejavu]
#  P3.2: [Fills]

# CONTROLLER 4:
#  P4.1: [DB Variation]
#  P4.2: [DB Activity]

# CONTROLLER 5:
#  P5.1: [SD Rolls]
#  P5.2: [SD Offbeats]

# CONTROLLER 6:
#  P6.1: [SD Variation]
#  P6.2: [SD Activity]

# CONTROLLER 7:
#  P7.1: [HH Variation]
#  P7.2: [HH Activity]

# CONTROLLER 8:
#  P8.1: [HH Accents]
#  P8.2: [Freq Modulat]

# CONTROLLER 9:
#  P9.1: [PC Variation]
#  P9.2: [PC Activity]

[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p2b8]

# -------------------------------------------------
# Inputs
# -------------------------------------------------

# [copy]
#   input = I1
#   output = _CLOCK

[gatetool]
    gatelength = 0.01
    inputtrigger = I1
    outputgate = _CLOCK

[copy]
    input = I2
    output = _RESET

# -------------------------------------------------
# Controls
# -------------------------------------------------

[pot]
    notch = 0.1
    pot = P1.2
    output = _POT_ACTIVITY

[pot]
    notch = 0.1
    pot = P4.2
    output = _POT_ACTIVITY_BD

[pot]
    notch = 0.1
    pot = P6.2
    output = _POT_ACTIVITY_SD

[pot]
    notch = 0.1
    pot = P7.2
    output = _POT_ACTIVITY_HH

[pot]
    notch = 0.1
    pot = P9.2
    output = _POT_ACTIVITY_PC

[mixer]
    input1 = _POT_ACTIVITY
    input2 = -0.5
    output = _ACTIVITY

[button]
    button = B1.4
    led = L1.4
    offvalue = 2
    onvalue = 4
    output = _ALTERNATE_BARS

[copy]
    input = 1
    output = _BRANCHES

[copy]
    input = B1.8
    output = _ACCENTS

[button]
    button = B1.1
    led = L1.1
    inverted = _BD_UNMUTED

[button]
    button = B1.3
    led = L1.3
    inverted = _SD_UNMUTED

[button]
    button = B1.5
    led = L1.5
    inverted = _HH_UNMUTED

[button]
    button = B2.8
    led = L2.8
    inverted = _PC_UNMUTED

[button]
    button = B1.2
    states = 1
    led = L1.2
    output = _ALT_BUTTON

