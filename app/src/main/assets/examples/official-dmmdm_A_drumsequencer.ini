    activity = _POT_ACTIVITY_SD + _ACTIVITY
    variation = P6.1
    rolls = P5.1
    rollcount = 1
    rollsteps = 2
    rollstartvelo = 0.5V
    lengthbutton = B1.6
    accentbutton = _ACCENTS
    alternatebutton = _ALT_BUTTON
    alternatebars = _ALTERNATE_BARS
