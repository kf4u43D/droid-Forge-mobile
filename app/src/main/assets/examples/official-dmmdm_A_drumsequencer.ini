# -------------------------------------------------
# Claps (CL)
# -------------------------------------------------

[sequencer]
    clock = _CLOCK
    reset = _RESET
    steps = 8
    stages = 8
    gate1 = off
    gate2 = off
    gate3 = off
    gate4 = off
    gate5 = on
    gate6 = off
    gate7 = off
    gate8 = off
    gateoutput = _CLAPS_TRIGGER_SEQ

# SD -> CL (Claps doubles SD rhythm)
[button]
    button = B2.4
    led = L2.4
    offvalue = _CLAPS_TRIGGER_SEQ
    onvalue = _SD_TRIGGER
    output = _CLAPS_TRIGGER

# Mute button
[button]
    button = B1.7
    led = L1.7
    onvalue = 0
    offvalue = _CLAPS_TRIGGER
    output = G1.7

# -------------------------------------------------
# Ducking
# -------------------------------------------------

# Ducking source
[button]
    button = B2.2
    onvalue = G1.1
    offvalue = _CLOCK_DIV_4
    output = O4

[contour]
    gate = O4
    release = 0.3
    output = L2.2

[clocktool]
    clock = _CLOCK
    reset = _RESET
    output = _CLOCK_DIV_4
    divide = 4
    gatelength = 0.01

# -------------------------------------------------
# Clockteiler für Magneto
# -------------------------------------------------

[button]
    button = B2.7
    led = L2.7
    value1 = 2
    value2 = 4
    value3 = 6
    output = _MAGNETO_CLOCK_DIV

[clocktool]
    clock = _CLOCK
    reset = _RESET
    divide = _MAGNETO_CLOCK_DIV
    output = G1.6

# -------------------------------------------------
# Modulation of Frequency Shifter
# -------------------------------------------------

[clocktool]
    clock = _CLOCK
    divide = 8
    output = _FREQ_MOD_CLOCK

[sequencer]
    clock = _FREQ_MOD_CLOCK
    pitch1 = 0
    pitch2 = 0.5 * P8.2
    pitchoutput = O1
