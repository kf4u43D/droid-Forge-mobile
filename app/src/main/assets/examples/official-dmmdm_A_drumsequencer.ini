# Open HH = HH plus Accent
[logic]
    input1 = _HH_TRIGGER * _HH_UNMUTED
    input2 = _HH_ACCENTS
    and = G1.5

# Closed HH = HH without Accent
[logic]
    input1 = _HH_ACCENTS
    nand = _HH_NO_ACC

[logic]
    input1 = _HH_TRIGGER * _HH_UNMUTED
    input2 = _HH_NO_ACC
    and = G1.4

[switch]
    reset = _RESET
    forward = _CLOCK
    input1 = P8.1 * -1 + 1
    input2 = P8.1
    output1 = O5

# -------------------------------------------------
# Percussion (PC)
# -------------------------------------------------

[button]
    button = B2.6
    offvalue = _PC_ACCENTS
    onvalue = _PC_RANDOM_BW
    led = L2.6
    output = _PC_MODULATION

[random]
    output = _PC_RANDOM_BW
    minimum = 0
    maximum = 1
    steps = 2
    clock = _PC_TRIGGER * _PC_UNMUTED

[slew]
    input = _PC_MODULATION * P2.2
    linear = O8
    slew = 0.005

[slew]
    input = _PC_MODULATION * P2.1
    linear = O3
    slew = 0.005

[algoquencer]
    clock = _CLOCK
    reset = _RESET
    trigger = _PC_TRIGGER
    accent = _PC_ACCENTS
    branches = _BRANCHES
    repeats = 2
    morphs = P1.1
    dejavu = P3.1
    activity = _POT_ACTIVITY_PC + _ACTIVITY
    variation = P9.1
    lengthbutton = B1.6
    accentbutton = _ACCENTS
    alternatebutton = _ALT_BUTTON
