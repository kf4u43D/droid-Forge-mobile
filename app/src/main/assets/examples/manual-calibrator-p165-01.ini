[calibrator]
    input = I1
    output = O4
    nudgeup = _UP
    nudgedown = _DOWN
    correction = _CORRECTION
    clearhere = _CLEARHERE
    nudgeamount = 0.01

[encoder]
    encoder = 4
    movedup = _UP
    moveddown = _DOWN
    override = _CORRECTION * 2
    button = _CLEARHERE
    mode = 2 # make it bipolar
    color = 0.4 # green
    negativecolor = 0.8 # red
