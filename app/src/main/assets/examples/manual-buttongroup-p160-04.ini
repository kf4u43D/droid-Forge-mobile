[buttongroup]
    select = L1.1 # be active only when L1.1 is active
    button1 = B1.3
    button2 = B1.4
    button3 = B1.5
    button4 = B1.6
    button5 = B1.7
    button6 = B1.8
    led1 = L1.3
    led2 = L1.4
    led3 = L1.5
    led4 = L1.6
    led5 = L1.7
    led6 = L1.8
    value1 = 0  # C
    value2 = 2  # D
    value3 = 5  # F
    value4 = 7  # G
    value5 = 9  # A
    value6 = 10 # Bb
    output = _ROOT

[buttongroup]
    select = L1.2 # be active only when L1.2 is active
    button1 = B1.3
    button2 = B1.4
    button3 = B1.5
    button4 = B1.6
    button5 = B1.7
    button6 = B1.8
    led1 = L1.3
    led2 = L1.4
    led3 = L1.5
    led4 = L1.6
    led5 = L1.7
    led6 = L1.8
    value1 = 1  # major
    value2 = 6  # dorian minor
    value3 = 7  # natural minor
    value4 = 9  # phrygian minor
    value5 = 10 # diminished scale
    value6 = 2  # mixolydian
    output = _DEGREE

