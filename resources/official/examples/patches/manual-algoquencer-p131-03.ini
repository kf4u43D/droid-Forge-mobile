[buttongroup]
    button1 = B2.7 # select track 1
    button2 = B2.8 # select track 2
    led1 = L2.7
    led2 = L2.8

[algoquencer]
    select =  L2.7 # becomes 1 if B2.7 is selected
    button1 = B1.1
    button2 = B1.2
    ...
    led1    = L1.1
    led2    = L1.2
    ...

[algoquencer]
    select =  L2.8 # becomes 1 if B2.8 is selected
    button1 = B1.1
    button2 = B1.2
    ...
    led1    = L1.1
    led2    = L1.2
    ...
