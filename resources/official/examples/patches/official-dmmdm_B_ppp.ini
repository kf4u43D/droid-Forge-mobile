    bipolar = 1

# -------------------------------------------------
# Ribbon pressure + gate
# -------------------------------------------------

[copy]
    input = P4.2 * 1 + 0.3
    output = _RIBBON_PRESSURE_CALIBRATION

[math]
    input1 = I4 * _RIBBON_PRESSURE_CALIBRATION
    input2 = 0
    maximum = _RIBBON_PRESSURE_RAW

# Create a gate signal from the ribbon presure by comparing it with a fixed value
[compare]
    input = _RIBBON_PRESSURE_RAW
    compare = 0.02 # Set the threshold for detecting the gate here
    ifgreater = 1
    output = _RIBBON_GATE_BEFORE_LOOPER

# If the pressure is below the threshold, we force it to be 0, since without an active ribbon
# gate the pitch of the ribbon controller is undefined.
[copy]
    input = _RIBBON_PRESSURE_RAW * _RIBBON_GATE_BEFORE_LOOPER
    output = _RIBBON_PRESSURE

[copy]
    input = _RIBBON_GATE_BEFORE_LOOPER
    output = L2.4

[copy]
    input = _RIBBON_GATE * -1 + 1
    output = _RIBBON_GATE_CLOSED

[copy]
    input = _RIBBON_GATE * _CLOCK
    output = _RIBBON_PERM_GATE

# -------------------------------------------------
# Ribbon position / pitch
# -------------------------------------------------

# Output voltage range from DOEPFER ribbon controller:  0.013V .... 8.91V (at max position)
# (0.0013 ... 0.891). That makes the range 0.891 - 0.0013 = 0.8897. We scale this up to
# 1.0 by multiplying with 1.123974373384
[copy]
    input = I3 * 1.123974373384 - 0.0014611666853996
    output = _RIBBON_POS_NORMALIZED

[copy]
    input = _RIBBON_POS_NORMALIZED
    output = L2.3

[sample]
    input = _RIBBON_POS_NORMALIZED * 5V
    gate = _RIBBON_GATE_BEFORE_LOOPER
    output = _RIBBON_PITCH_INPUT

[copy]
    input = S5.2 * 1V - 2V
    output = _RIBBON_OFFSET

# -------------------------------------------------
# Ribbon looper
# -------------------------------------------------

# Select the length of the loop with a simple button group with three buttons.
# There are just 3 possible lengths: 1 bar, 2 bars, 4 bars. A bar is 16 clock ticks.
# Done.
[buttongroup]
    button1 = B4.2
    button2 = B4.4
    button3 = B4.6
    led1 = L4.2
    led2 = L4.4
    led3 = L4.6
    value1 = 16
    value2 = 32
    value3 = 64
    output = _LOOP_LENGTH

# Button for enabling overdub mode
[button]
    button = B4.8
    led = L4.8
    output = _RIBBON_LOOP_OVERDUB

# Derive bypass from the loop switch position
[ifequal]
    input1 = S5.9
    input2 = 1
    ifequal = 1
    else = 0
    output = _RIBBON_LOOP_BYPASS

# Derive the loop mode from the loop switch position
[ifequal]
    input1 = S5.9
    input2 = 0
    ifequal = 0
    else = 1
    output = _RIBBON_LOOP_SWITCH

# CV looper for the ribbon input (pitch) signal and the "Ribbon is hold down" signal. The ribbon pressure
# is done in a second looper.
[cvlooper]
    clock = _CLOCK
    reset = _RESET
    tapespeed = 0.2
    cvin = _RIBBON_PITCH_INPUT
    gatein = _RIBBON_GATE_BEFORE_LOOPER
    cvout = _RIBBON_PITCH_LOOPED
    gateout = _RIBBON_GATE
    loopswitch = _RIBBON_LOOP_SWITCH
    overlay = 1
    bypass = _RIBBON_LOOP_BYPASS + _CLOCK_STOPPED
    overdub = _RIBBON_LOOP_OVERDUB
    length = _LOOP_LENGTH

# CV looper for the ribbon pressure.
[cvlooper]
    clock = _CLOCK
    reset = _RESET
    tapespeed = 0.2
    cvin = _RIBBON_PRESSURE
    gatein = _RIBBON_GATE_BEFORE_LOOPER
    cvout = _RIBBON_PRESSURE_LOOPED
    loopswitch = _RIBBON_LOOP_SWITCH
    overlay = 1
    bypass = _RIBBON_LOOP_BYPASS + _CLOCK_STOPPED
    overdub = _RIBBON_LOOP_OVERDUB
    length = _LOOP_LENGTH

