# -------------------------------------------------
# Inputs
# -------------------------------------------------

# Clock
[copy]
    input = G1.1
    output = _CLOCK

# Reset
[copy]
    input = G1.2
    output = _RESET

[quantizer]
    input = I5
    output = _PITCH_SEQUENCER_1

[quantizer]
    input = I6
    output = _PITCH_SEQUENCER_2

[quantizer]
    input = I7
    output = _PITCH_SEQUENCER_3

[quantizer]
    input = I8
    output = _PITCH_SEQUENCER_4

# -------------------------------------------------
# Modes
# -------------------------------------------------

[gatetool]
    inputtrigger = _CLOCK
    outputgate = _CLOCK_RUNNING
    gatelength = 2

[copy]
    input = _CLOCK_RUNNING * -1 + 1
    output = _CLOCK_STOPPED

# Create a clock that is running with maximum speed: two DROID cycles per oscillation.
# [copy]
#   input = _CYCLE_CLOCK * -1 + 1
#   output = _CYCLE_CLOCK

[copy]
    input = S5.1 * 1V - 2V # When the switch is set to 1 or more, the tuning octave ranges from 0V to 6V, so we need to substract 1V
    output = _TUNING_PITCH

[ifequal]
    input1 = S5.1
    input2 = 0
    ifequal = 0
    else = 1
    output = _TUNING_MODE

[copy]
    input = _TUNING_MODE * -1 + 1
    output = _NO_TUNING_MODE

# [mixer]
#   input1 = B1.1
#   input2 = B1.2
#   input3 = B1.3
#   input4 = B1.4
#   output = _OCTAVE_MODE_BUTTON

[ifequal]
    input1 = _OCTAVE_MODE + _SWITCH_MODE
    input2 = 0
    ifequal = 1
    output = _DIATONIC_MODE

[buttongroup]
    button1 = B6.1
    button2 = B6.2
    led1 = L6.1
    led2 = L6.2
    minactive = 0
    maxactive = 1
    buttonoutput1 = _OCTAVE_MODE
    buttonoutput2 = _SWITCH_MODE

# [button]
#   button = B6.1 + _OCTAVE_MODE_BUTTON
#   led = L6.1
#   output = _OCTAVE_SWITCHES
#   inverted = _NO_OCTAVE_SWITCHES

[copy]
    input = _NO_TUNING_MODE * _DIATONIC_MODE
    output = _ENCODER_MODE_DIATONIC_TRANS

[copy]
    input = _NO_TUNING_MODE * _OCTAVE_MODE
    output = _ENCODER_MODE_OCTAVES

[copy]
    input = _NO_TUNING_MODE * _SWITCH_MODE
    output = _ENCODER_MODE_SWITCHES

