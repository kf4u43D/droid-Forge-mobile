# (B) Pitch processor, envelopes

# for TB, LD, OR, AR

# INPUTS:
#  I1: [ROOT]
#  I2: [SCALE]
#  I3: [POS] Ribbon Position
#  I4: [PRESS] Ribbon pressure
#  I5: [TB V/O]
#  I6: [LD V/O]
#  I7: [OR V/O]
#  I8: [AR V/O]

# OUTPUTS:
#  O1: [TB V/O]
#  O2: [LD V/O]
#  O3: [OR V/O]
#  O4: [AR V/O]
#  O5: [TB Env]
#  O6: [LD Env]
#  O7: [OR Env]
#  O8: [AR Env]

# GATES ON MODULE 1:
#  G1.1: [CLOCK]
#  G1.2: [RESET]
#  G1.6: [LD Out]
#  G1.7: [OR Out]
#  G1.8: [AR Out]

# GATES ON MODULE 2:
#  G2.1: [TB Gate]
#  G2.2: [LD Gate]
#  G2.3: [OR Gate]
#  G2.4: [AR Gate]
#  G2.5: [TB Acc] Input
#  G2.6: [LD Acc] Input
#  G2.7: [OR Acc] Input
#  G2.8: [AR Acc] Input

# CONTROLLER 1:
#  E1.1: [TB shift/cal] Pitch calibration for TB
#  E1.2: [LD shift/cal] Pitch calibration for LD
#  E1.3: [OR shift/cal] Pitch calibration for OR
#  E1.4: [AR shift/cal] Pitch calibration for AR

# CONTROLLER 2:
#  P2.1: [Vibrato]
#  P2.2: [Tremolo]
#  P2.3: [Bend 2] Pitch bend 2 semitones up/down
#  P2.4: [Bend 3] Pitch bend 3 semitones up/down

# CONTROLLER 3:
#  P3.1: [Vib speed]
#  P3.2: [Vib delay]
#  B3.1: [ROOT]
#  B3.2: [3RD]
#  B3.3: [5TH]
#  B3.4: [7TH]
#  B3.5: [9TH]
#  B3.6: [11TH]
#  B3.7: [13TH]
#  B3.8: [ALT 7]

# CONTROLLER 4:
#  P4.1: [Rib Slew] Slew limiter for ribbon
#  P4.2: [Ribbon pressure] Calibration of ribbon pressure input
#  B4.1: [ALT 9]
#  B4.2: [1 Bar] Loop length 1 bar (16 clock ticks)
#  B4.3: [ALT 3]
#  B4.4: [2 Bars] Loop length 2 bars
#  B4.5: [ALT 4]
#  B4.6: [4 Bars] Loop length 4 bars
#  B4.7: [ALT 6/13]
#  B4.8: [OVDub] Loop Overdup

# CONTROLLER 5:
#  S5.1: [Tuning] 0 = Off, 1-7 = tuning + octave switch
#  S5.2: [Ribbon octav]
#  S5.3: [8/16/32]
#  S5.4: [TB Rib] 0:off, 1:prio=seq, 2:prio=ribbon
#  S5.5: [Triplets]
#  S5.6: [LD Rib]
#  S5.7: [Std/Byp] Normal / Steady / Bypass
#  S5.8: [OR Rib]
#  S5.9: [Loop] Loop on/mute/off
#  S5.10: [AR Rib]

# CONTROLLER 6:
#  P6.1: [TB Envmix]
#  P6.2: [LD Envmix]
#  P6.3: [OR Envmix]
#  P6.4: [AR Envmix]
#  B6.1: [Octave] Selects octave switches on encoders
#  B6.2: [Switch] Swicht sequencer source per track

# CONTROLLER 7:
#  P7.1: [TB Attack]
#  P7.2: [Decay/Releas]
#  P7.3: [Sustain]
#  P7.4: [Level] Calibration of output level
#  P7.5: [Track]
#  P7.6: [Shape]
#  P7.7: [Accents]
#  P7.8: [Level ?]
#  P7.9: [Del Vib] Delayed vibrato
#  P7.10: [Speed ?]

# CONTROLLER 8:
#  P8.1: [LD Attack]
#  P8.2: [Decay/Releas]
#  P8.3: [Sustain]
#  P8.4: [Level] Calibration of output level
#  P8.5: [Track] Evenlope pitch tracking
#  P8.6: [Shape]
#  P8.7: [Accents]
#  P8.8: [Level ?]
#  P8.9: [Del Vib] Delayed vibrato
#  P8.10: [Speed ?] Calibration of accent level

# CONTROLLER 9:
#  P9.1: [OR Attack]
#  P9.2: [Decay/Releas]
#  P9.3: [Sustain]
#  P9.4: [Level] Calibration of output level
#  P9.5: [Track]
#  P9.6: [Shape]
#  P9.7: [Accents]
#  P9.8: [Level ?]
#  P9.9: [Del Vib]
#  P9.10: [Speed ?]

# CONTROLLER 10:
#  P10.1: [AR Attack]
#  P10.2: [Decay/Releas]
#  P10.3: [Sustain]
#  P10.4: [Level] Calibration of output level
#  P10.5: [Track] Delayed vibrato
#  P10.6: [Shape] Calibration of accent level
#  P10.7: [Accents]
#  P10.8: [Level ?]
#  P10.9: [Del Vib] Evenlope pitch tracking
#  P10.10: [Speed ?]

