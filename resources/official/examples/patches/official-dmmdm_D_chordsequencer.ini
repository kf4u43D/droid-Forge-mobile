# (D) Chord sequencer
# LABELS: master=16

# 

# INPUTS:
#  I1: [CLOCK]
#  I2: [RESET]
#  I3: [Ch Trig]
#  I4: [LB Trig]

# OUTPUTS:
#  O1: [ROOT] Current root note (V/Oct)
#  O2: [SCALE] Current scale
#  O4: [LB] V/O for low bass
#  O5: [CH 1] Chord note 1
#  O6: [CH 2] Chord note 2
#  O7: [CH 3] Chord note 3
#  O8: [CH 4] Chord note 4

# CONTROLLER 1:
#  P1.1: [SLEW CHORDS]
#  P1.2: [SLEW LB]
#  P1.3: [Vib Chords]
#  P1.4: [Vib LB]
#  P1.5: [Length] Length of the chord sequence or loop as a number of steps
#  P1.6: [Detune]
#  P1.7: [Vib Del Ch]
#  P1.8: [Vib Del LB]
#  S1.1: [1 | 2 | 4] Length of a step as a number of bars (= 16 clock ticks)
#  S1.2: [x8 /8] Steps *8 or /8
#  S1.3: [Preset]
#  S1.4: [Loop]
#  S1.5: [Oct 1]
#  S1.6: [Oct 2]
#  S1.7: [Oct 3]
#  S1.8: [Oct 4]

# CONTROLLER 2:
#  B2.1: [C]
#  B2.2: [C#]
#  B2.3: [D]
#  B2.4: [D#]
#  B2.5: [E]
#  B2.6: [F]
#  B2.7: [F#]
#  B2.8: [G]
#  B2.9: [G#]
#  B2.10: [A]
#  B2.11: [A#]
#  B2.12: [B]
#  B2.13: [maj]
#  B2.14: [lyd]
#  B2.15: [ROOT] Jump to step 1
#  B2.16: [3RD]
#  B2.17: [min]
#  B2.18: [dor]
#  B2.19: [5TH]
#  B2.20: [7TH]
#  B2.21: [mixo]
#  B2.22: [hm5]
#  B2.23: [9TH]
#  B2.24: [11TH]
#  B2.25: [phr]
#  B2.26: [min#7]
#  B2.27: [13TH]
#  B2.28: [Unisono]
#  B2.29: [<] Move cursor one step left
#  B2.30: [>] Move cursor one step right
#  B2.31: [SEQ] Enable sequencer
#  B2.32: [TRANS] Global transposition

# CONTROLLER 3:
#  P3.1: [Tuning]
#  P3.2: [Vibrato Hz]
#  B3.1: [ROOT]
#  B3.2: [3RD]
#  B3.3: [5TH]
#  B3.4: [7TH]
#  B3.5: [9TH]
#  B3.6: [11TH]
#  B3.7: [13TH]
#  B3.8: [Freeze LB] Freezes the LB at the same pitch regardless of anything else

# CONTROLLER 4:
#  E4.1: [Spread] Chord spread
#  E4.2: [Inversion] Chord inversion
#  E4.3: [Chord pitch] Chord base pitch
#  E4.4: [Low Bass] Pitch of low bass

[p8s8]
[b32]
[p2b8]
[e4]

# -------------------------------------------------
# Global
# -------------------------------------------------

[copy]
    input = I1
    output = _CLOCK

[copy]
    input = I2
    output = _RESET

# Unisono mode
[button]
    button = B2.28
    output = _UNISONO
    onvalue = -3
    offvalue = 0
    states = 1
    led = L2.28

[pot]
    pot = P1.1 * _NO_TUNING_MODE
    outputscale = 0.9
    output = _CHORD_SLEW

[pot]
    pot = P1.2 * _NO_TUNING_MODE
    outputscale = 0.9
    output = _LOW_BASS_SLEW

[pot]
    pot = P1.5
    preset = _PRESET
    discrete = 8
    outputoffset = 1
    output = _SEQUENCE_NUM_STEPS

[button]
    button = B2.32
    led = L2.32
    states = 1
    output = _GLOBAL_TRANS_MODE
    inverted = _NO_GLOBAL_TRANS_MODE

[copy]
    input = S1.3
    output = _PRESET

# -------------------------------------------------
# Tuning mode
# -------------------------------------------------

[pot]
    pot = P3.1
    discrete = 8
    output = _TUNING_MODE

[ifequal]
    input1 = _TUNING_MODE
    input2 = 0
    ifequal = 1
    else = 0
    output = _NO_TUNING_MODE

[copy]
    input = _TUNING_MODE * 1V - 1V
    output = _TUNING_PITCH

# -------------------------------------------------
# Cursor + Sequencer
# -------------------------------------------------

# Move the step cursor forward and backward using a nudge circuit and two buttons.
[nudge]
    buttonup = B2.30
    buttondown = B2.29
    amount = 1
    startvalue = 1
    minimum = 1
    maximum = _SEQUENCE_NUM_STEPS
    wrap = 1
    ledup = L2.30
    leddown = L2.29
    output = _MANUAL_CURSOR_POSITION

# During tuning mode the cursor position is zero, otherwise between 1 and 8
[ifequal]
    input1 = _TUNING_MODE
    input2 = 0
    ifequal = _MANUAL_CURSOR_POSITION
    else = 0
    output = _CURSOR_POSITION

[copy]
    input = S1.1
    output = _BARS_PER_STEP_SWITCH

[copy]
    input = S1.2
    output = _BARSPERSTEP_DIVTIMES8_SWITCH

# Use nudge to create a pointer to the current sequence step. This nudge is forwarded by the
# clock, not manually.
#
# This is an eternal counter that does not wrap. It counts the bare clock ticks since the last
# reset or the system start. From this number the current sequence step is computed by taking
# into account the sequence length and the number of ticks per step.
#
# We start with -1 in order to get the math right.
[nudge]
    amount = 1
    buttonup = _CLOCK
    clear = _RESET
    dontsave = 1
    minimum = 0
    startvalue = 0
    output = _COUNTER_M1

# Right after reset the position is -1 (in order to exactly align the chord progression). Cap this to zero
# to avoid playing the last bar for one clock tick after reset.
[math]
    input1 = _COUNTER_M1
    input2 = 0
    maximum = _INFINTE_CLOCK_COUNTER

# Divide the infinite counter by the number of clock ticks a step has. This gives us the infinite step number.
[math]
    input1 = _INFINTE_CLOCK_COUNTER
    input2 = _CLOCKTICKS_PER_STEP
    quotient = _INFINITE_STEP_COUNTER_FLOAT

# The quotient created fractions. Round this down to the lower integer.
[math]
    input1 = _INFINITE_STEP_COUNTER_FLOAT
    floor = _INFINITE_STEP_COUNTER

# Now use a modulo operation to fold the bar number into the range 0 ... LENGTH-1
[math]
    input1 = _INFINITE_STEP_COUNTER
    input2 = _SEQUENCE_NUM_STEPS
    modulo = _CLOCKED_STEP

[switch]
    input1 = 1
    input2 = 0
    input3 = 0
    input4 = 0
    input5 = 0
    input6 = 0
    input7 = 0
    input8 = 0
    offset = _CURSOR_POSITION * -1 + 1
    output1 = _STEP1_CURSOR
    output2 = _STEP2_CURSOR
    output3 = _STEP3_CURSOR
    output4 = _STEP4_CURSOR
    output5 = _STEP5_CURSOR
    output6 = _STEP6_CURSOR
    output7 = _STEP7_CURSOR
    output8 = _STEP8_CURSOR

# Button for switching between the automatic sequencer and the manual one. In manual mode you move the active
# sequence step with the button < and >. In the automatic mode the step is moved forward with the clock
[button]
    button = B2.31
    led = L2.31
    offvalue = -1 * 1 + _CURSOR_POSITION
    onvalue = _CLOCKED_STEP
    output = _STEP

# -------------------------------------------------
# LED Screen
# The inputs LED 1-8 represent the eight steps of the sequencer
# 
# - blue -> step is part of the sequence (1 is always blue hence)
# - white -> step is currently played
# - red -> step is currently edited
# - orange -> step is edited and played
# -------------------------------------------------

