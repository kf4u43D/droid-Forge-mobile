# -------------------------------------------------
# Root and Scale + Looper
# -------------------------------------------------

# Selects the number of clock ticks per sequence step, if the 8/8 switch is in the lower position (div 8)
[switch]
    input1 = 2
    input2 = 4
    input3 = 8
    offset = _BARS_PER_STEP_SWITCH
    output1 = _CLOCKTICKS_PER_STEP_DIV8

# Selects the number of clock ticks per sequence step, if the 8/8 switch is in the center position.
[switch]
    input1 = 16
    input2 = 32
    input3 = 64
    offset = _BARS_PER_STEP_SWITCH
    output1 = _CLOCKTICKS_PER_STEP_NORMAL

# Selects the number of clock ticks per sequence step, if the 8/8 switch is in the upper position (times 8)
[switch]
    input1 = 128
    input2 = 256
    input3 = 512
    offset = _BARS_PER_STEP_SWITCH
    output1 = _CLOCKTICKS_PER_STEP_TIMES8

[switch]
    input1 = _CLOCKTICKS_PER_STEP_DIV8
    input2 = _CLOCKTICKS_PER_STEP_NORMAL
    input3 = _CLOCKTICKS_PER_STEP_TIMES8
    offset = _BARSPERSTEP_DIVTIMES8_SWITCH
    output1 = _CLOCKTICKS_PER_STEP

[copy]
    input = _CLOCKTICKS_PER_STEP * _SEQUENCE_NUM_STEPS
    output = _SEQUENCE_NUM_CLOCKTICKS

[ifequal]
    input1 = S1.4
    input2 = 1
    ifequal = 1
    else = 0
    output = _LOOP_MUTED

[ifequal]
    input1 = S1.4
    input2 = 0
    ifequal = 0
    else = 1
    output = _LOOP_SWITCH

# Note: The looper just records the CV range -1 ... 1. So we need to fold ROOT (which is 0 ... 11)
# into that range and back again later.
[cvlooper]
    cvin = _ROOT_UNLOOPED * 0.05
    tapespeed = 0.1
    cvout = _ROOT_DOWNSCALED
    clock = _CLOCK
    reset = _RESET
    length = _SEQUENCE_NUM_CLOCKTICKS
    loopswitch = _LOOP_SWITCH
    bypass = _LOOP_MUTED

[copy]
    input = _ROOT_DOWNSCALED * 20
    output = _ROOT_UNTRANSPOSED

[math]
    input1 = _ROOT_UNTRANSPOSED + _GLOBAL_TRANSPOSITION
    input2 = 12
    modulo = _ROOT

[cvlooper]
    cvin = _SCALE_UNLOOPED * 0.02
    tapespeed = 0.1
    cvout = _SCALE_DOWNSCALED
    clock = _CLOCK
    reset = _RESET
    length = _SEQUENCE_NUM_CLOCKTICKS
    loopswitch = _LOOP_SWITCH
    bypass = _LOOP_MUTED

[copy]
    input = _SCALE_DOWNSCALED * 50
    output = _SCALE

[copy]
    input = _ROOT / 120
    output = O1

[copy]
    input = _SCALE / 120
    output = O2

# -------------------------------------------------
# Chord generator
# -------------------------------------------------

[button]
    button = B4.3
    output = _CHORD_PITCH_RAND_SEL
    inverted = _NO_CHORD_PITCH_RAND_SEL
    startvalue = 0

# Randomization of chord pitch. We use a bipolar encoder. Left hemisphere: pseudo random (alogquencer), right hemisphere: true random.
[encoder]
    encoder = E4.3
    select = _CHORD_PITCH_RAND_SEL
    notch = 0.1
    mode = 2
    negativecolor = 1.2
    color = 0.8
    output = _CHORD_PITCH_RAND_SETTING

# True random generator for chord pitches
[random]
    maximum = _CHORD_PITCH_RAND_SETTING * 1V
    minimum = _CHORD_PITCH_RAND_SETTING * -1V
    output = _CHORD_PITCH_RAND_RANDOM

# Pseudo random generator for chord pitches
[algoquencer]
    clock = _CLOCK
    pitchhigh = 1V
    pitchlow = -1V
    morphs = 0.05
    pitch = _CHORD_PITCH_RAND_ALGO

[compare]
    input = _CHORD_PITCH_RAND_SETTING
    compare = 0
    ifgreater = _CHORD_PITCH_RAND_RANDOM * _CHORD_PITCH_RAND_SETTING
    else = _CHORD_PITCH_RAND_ALGO * _CHORD_PITCH_RAND_SETTING
    output = _CHORD_PITCH_RANDOM

[sample]
    input = _CHORD_PITCH_RANDOM
    sample = I3
    output = _CHORD_PITCH_RANDOM_SYNCED

[mixer]
    input1 = _CHORD_PITCH + 1V
    input2 = _CHORD_SPREAD * -0.5
    output = _CHORD_PITCH_COMPENSATED

[chord]
    root = _ROOT
    degree = _SCALE
    spread = _CHORD_SPREAD
    pitch = _CHORD_PITCH_COMPENSATED + _CHORD_PITCH_RANDOM_SYNCED
    inversion = _CHORD_INVERSION
    select1 = _SEL_ROOT
    select3 = _SEL_3RD
    select5 = _SEL_5TH
    select7 = _SEL_7TH
    select9 = _SEL_9TH
    select11 = _SEL_11TH
    select13 = _SEL_13TH
    tuningmode = _TUNING_MODE
    tuningpitch = _TUNING_PITCH
    output1 = _CH_OUT_1
    output2 = _CH_OUT_2
    output3 = _CH_OUT_3
    output4 = _CH_OUT_4

[slew]
    input = _CH_OUT_1
    slew = _CHORD_SLEW
    exponential = _CH_SLEWED_1

[slew]
    input = _CH_OUT_2
    slew = _CHORD_SLEW
    exponential = _CH_SLEWED_2

[slew]
    input = _CH_OUT_3
    slew = _CHORD_SLEW
    exponential = _CH_SLEWED_3

[slew]
    input = _CH_OUT_4
    slew = _CHORD_SLEW
    exponential = _CH_SLEWED_4

# -------------------------------------------------
# Chord calibrator
# -------------------------------------------------

[copy]
    input = S1.5 * 1V - 1V
    output = _OCT_SWITCH_1

[copy]
    input = S1.6 * 1V - 1V
    output = _OCT_SWITCH_2

[copy]
    input = S1.7 * 1V - 1V
    output = _OCT_SWITCH_3

[copy]
    input = S1.8 * 1V - 1V
    output = _OCT_SWITCH_4

[encoder]
    select = _TUNING_MODE
    encoder = E4.1
    movedup = _CAL_UP_1
    moveddown = _CAL_DOWN_1
    override = _CAL_CORRECTION_1 * 2
    button = _CAL_CLEARHERE_1
    mode = 2
    color = 0.4
    negativecolor = 0.8

[calibrator]
    input = _CH_SLEWED_1 + _OCT_SWITCH_1
    nudgeup = _CAL_UP_1
    nudgedown = _CAL_DOWN_1
    correction = _CAL_CORRECTION_1
    output = _CALIBRATED_CH_1
    nudgeamount = 0.01
    clearhere = _CAL_CLEARHERE_1

[encoder]
    select = _TUNING_MODE
    encoder = E4.2
    movedup = _CAL_UP_2
    moveddown = _CAL_DOWN_2
    override = _CAL_CORRECTION_2 * 2
    button = _CAL_CLEARHERE_2
    mode = 2
    color = 0.4
    negativecolor = 0.8

[calibrator]
    input = _CH_SLEWED_2 + _OCT_SWITCH_2
    nudgeup = _CAL_UP_2
    nudgedown = _CAL_DOWN_2
    correction = _CAL_CORRECTION_2
    output = _CALIBRATED_CH_2
    nudgeamount = 0.01
    clearhere = _CAL_CLEARHERE_2

[encoder]
    select = _TUNING_MODE
    encoder = E4.3
    movedup = _CAL_UP_3
    moveddown = _CAL_DOWN_3
    override = _CAL_CORRECTION_3 * 2
    button = _CAL_CLEARHERE_3
    mode = 2
    color = 0.4
    negativecolor = 0.8

[calibrator]
    input = _CH_SLEWED_3 + _OCT_SWITCH_3
    nudgeup = _CAL_UP_3
    nudgedown = _CAL_DOWN_3
    correction = _CAL_CORRECTION_3
    output = _CALIBRATED_CH_3
    nudgeamount = 0.01
    clearhere = _CAL_CLEARHERE_3

[encoder]
    select = _TUNING_MODE
    encoder = E4.4
    movedup = _CAL_UP_4
    moveddown = _CAL_DOWN_4
    override = _CAL_CORRECTION_4 * 2
    button = _CAL_CLEARHERE_4
    mode = 2
    color = 0.4
    negativecolor = 0.8

[calibrator]
    input = _CH_SLEWED_4 + _OCT_SWITCH_4
    nudgeup = _CAL_UP_4
    nudgedown = _CAL_DOWN_4
    correction = _CAL_CORRECTION_4
    output = _CALIBRATED_CH_4
    nudgeamount = 0.01
    clearhere = _CAL_CLEARHERE_4

# -------------------------------------------------
# Low bass
# -------------------------------------------------

[minifonion]
    input = 0V
    root = _ROOT
    degree = _SCALE
    noteshift = _LOW_BASS_NOTE
    output = _LOW_BASS_PITCH_UNFOLDED
    select1 = 1
    select3 = 0
    select5 = 0
    select7 = 0
    select9 = 0
    select11 = 0
    select13 = 0
    selectfill1 = 0
    selectfill2 = 0
    selectfill3 = 0
    selectfill4 = 0
    selectfill5 = 0

[fold]
    input = _LOW_BASS_PITCH_UNFOLDED
    minimum = _LOW_BASS_BASE_PITCH
    maximum = _LOW_BASS_BASE_PITCH + 0.999V
    foldby = 1V
    output = _LOW_BASS_PITCH_UNTUNED

[ifequal]
    input1 = _TUNING_MODE
    input2 = 0
    ifequal = _LOW_BASS_PITCH_UNTUNED
    else = _TUNING_PITCH
    output = _LOW_BASS_OUT

[button]
    button = B3.8
    led = L3.8
    onvalue = 0
    offvalue = 1
    output = _UNFREEZE_LB

[sample]
    input = _LOW_BASS_OUT
    gate = _UNFREEZE_LB
    output = _LOW_BASS_FROZEN

[slew]
    input = _LOW_BASS_FROZEN
    slew = _LOW_BASS_SLEW
    exponential = _LOW_BASS_SLEWED

# -------------------------------------------------
# Vibrato
# -------------------------------------------------

[pot]
    pot = P3.2
    slope = 2
    output = _VIBRATO_SPEED_POT

[pot]
    pot = P1.3
    slope = 2
    output = _VIBRATO_CH_DEPTH_POT

[pot]
    pot = P1.4
    slope = 2
    output = _VIBRATO_LB_DEPTH_POT

[lfo]
    hz = _VIBRATO_SPEED_POT * 100
    bipolar = 1
    level = _NO_TUNING_MODE * 0.1V
    triangle = _VIBRATO_LFO

# Delayed vibrato for Chords
[contour]
    trigger = I3
    hold = P1.7 * 2
    release = P1.7 * 1.1
    shape = 0.5
    level = _VIBRATO_CH_DEPTH_POT
    inverted = _CH_DELAYED_VIBRATO_LEVEL

# Delayed vibrato for low bass
[contour]
    trigger = I4
    hold = P1.8 * 2
    release = P1.8 * 1.1
    shape = 0.5
    level = _VIBRATO_LB_DEPTH_POT
    inverted = _LB_DELAYED_VIBRATO_LEVEL

[mixer]
    input1 = _CALIBRATED_CH_1
    input2 = _VIBRATO_LFO * _CH_DELAYED_VIBRATO_LEVEL
    output = _VIBRATED_CH_1

[mixer]
    input1 = _CALIBRATED_CH_2
    input2 = _VIBRATO_LFO * _CH_DELAYED_VIBRATO_LEVEL
    output = _VIBRATED_CH_2

[mixer]
    input1 = _CALIBRATED_CH_3
    input2 = _VIBRATO_LFO * _CH_DELAYED_VIBRATO_LEVEL
    output = _VIBRATED_CH_3

[mixer]
    input1 = _CALIBRATED_CH_4
    input2 = _VIBRATO_LFO * _CH_DELAYED_VIBRATO_LEVEL
    output = _VIBRATED_CH_4

[mixer]
    input1 = _LOW_BASS_SLEWED
    input2 = _VIBRATO_LFO * _LB_DELAYED_VIBRATO_LEVEL
    output = _VIBRATED_LB

# -------------------------------------------------
# Detune + Superjust
# -------------------------------------------------

[detune]
    input1 = _VIBRATED_CH_1
    input2 = _VIBRATED_CH_2
    input3 = _VIBRATED_CH_3
    input4 = _VIBRATED_CH_4
    input5 = _VIBRATED_LB
    detune = P1.6 * -0.6
    output1 = O5
    output2 = O6
    output3 = O7
    output4 = O8
    output5 = O4

# -------------------------------------------------
# MIDI output
# -------------------------------------------------

[lfo]
    hz = 200
    square = _MIDI_UPDATE

[midiout]
    pitch1 = _ROOT / 120
    gate1 = _MIDI_UPDATE
    ccnumber1 = 1
    cc1 = _SCALE / 127
    updateccs = _MIDI_UPDATE

# -------------------------------------------------
# LED Gauges
# -------------------------------------------------

[lfo]
    hz = 2.5
    square = _LOOP_BLINK

[mixer]
    input1 = _LOOP_SWITCH * 0.6
    input2 = _LOOP_MUTED * 0.4
    output = _LOOP_LED_COLOR

[copy]
    input = _LOOP_LED_COLOR * _LOOP_BLINK
    output = R13

[copy]
    input = _LOOP_LED_COLOR * _LOOP_BLINK
    output = R14

[copy]
    input = _LOOP_LED_COLOR * _LOOP_BLINK
    output = R15

[copy]
    input = _LOOP_LED_COLOR * _LOOP_BLINK
    output = R16

# Divide the infinite counter by the number of clock ticks a step has. This gives us the infinite step number.
[math]
    input1 = _INFINTE_CLOCK_COUNTER
    input2 = 16
    quotient = _INFINITE_BAR_COUNTER_FLOAT

# The quotient created fractions. Round this down to the lower integer.
[math]
    input1 = _INFINITE_BAR_COUNTER_FLOAT
    floor = _INFINITE_BAR_COUNTER

[math]
    input1 = _INFINITE_BAR_COUNTER
    input2 = 4
    modulo = _BAR_0_1_2_3

[switch]
    input1 = 0.2 * _PRESET + 0.3
    offset = _BAR_0_1_2_3 * -1
    output1 = R9
    output2 = R10
    output3 = R11
    output4 = R12
