# of it, or the sequencer gate output.
[switch]
    input1 = _CLOCK
    input2 = _T3_SEQUENCER_GATE
    input3 = _CLOCK_3_2
    input4 = _CLOCK_2_1
    input5 = _CLOCK_3_1
    input6 = _CLOCK_4_1
    input7 = _CLOCK_6_1
    input8 = _CLOCK_8_1
    output1 = _T3_ARP_CLOCK
    offset = _T3_ARP_CLOCKING

# Create taptempo for arp clock to be used for gate length
[switch]
    input1 = _CLOCK
    input2 = _T3_CLOCK
    input3 = _CLOCK_3_2
    input4 = _CLOCK_2_1
    input5 = _CLOCK_3_1
    input6 = _CLOCK_4_1
    input7 = _CLOCK_6_1
    input8 = _CLOCK_8_1
    output1 = _T3_ARP_TAPTEMPO
    offset = _T3_ARP_CLOCKING * _T3_ARP

# Select encoder if track 3 is selected, arp is on and control is not held
[logic]
    input1 = _T3_SELECTED * _NO_CONTROL
    input2 = _T3_ARP
    and = _T3_ENC_3_SELECTED

# Encoder for base pitch of arpeggiator
[encoder]
    encoder = 1
    select = _T3_ENC_3_SELECTED
    header = "Arp base pitch"
    color = 0.2
    discrete = 37
    sensivity = 3
    output = _T3_ARP_PITCH

# Select encoder if track 3 is selected, arp is on and control is held
[logic]
    input1 = _T3_SELECTED * _CONTROL
    input2 = _T3_ARP
    and = _T3_ENC_4_SELECTED

# Encoder for pitch range of arpeggiator
[encoder]
    encoder = 1
    select = _T3_ENC_4_SELECTED
    header = "Arp pitch range"
    color = 0.4
    discrete = 49
    startvalue = 24
    sensivity = 4
    output = _T3_ARP_RANGE

# Arpeggiator for track 3
[arpeggio]
    select1 = _T3_SEL_1
    select3 = _T3_SEL_2
    select5 = _T3_SEL_3
    select7 = _T3_SEL_4
    select9 = _T3_SEL_5
    select11 = _T3_SEL_6
    select13 = _T3_SEL_7
    selectfill1 = 0
    selectfill2 = 0
    selectfill3 = 0
    selectfill4 = 0
    selectfill5 = 0
    root = _ROOT * _T3_TBR_OFF
    transpose = _T3_TBR
    degree = _DEGREE
    clock = _T3_ARP_CLOCK * _RUNNING
    reset = _RESET
    tuningmode = _TUNINGMODE
    direction = _T3_ARP_UPDOWN
    pingpong = _T3_ARP_PINGPONG
    butterfly = _T3_ARP_BUTTERFLY
    octaves = _T3_ARP_OCTAVING
    drop = _T3_ARP_DROP
    pattern = _T3_ARP_PATTERN
    autoreset = _T3_ARP_AUTORESET
    pitch = _T3_ARP_PITCH / 120
    range = _T3_ARP_RANGE / 120
    output = _T3_ARP_OUTPUT

# Switch pitch output between sequencer and arpeggiator
[ifequal]
    input1 = _T3_ARP_SYNCED
    input2 = 0
    ifequal = _T3_PITCH
    else = _T3_ARP_OUTPUT + _T3_ARP_OCTAVE
    output = _T3_SWITCHED_PITCH

# Mix all sources of pitch together
[mixer]
    input1 = _T3_OCTAVE * 1V - 2V
    input2 = _T3_SWITCHED_PITCH
    input3 = _GLOBAL_OCTAVE_SWITCH * 1V - 2V
    input4 = _GLOBAL_TRANSPOSITION * 0.00833333
    output = _T3_FINAL_PITCH

# Slew limiter for glides
[slew]
    input = _T3_FINAL_PITCH
    exponential = O5
    slew = _T3_GLIDE * _T3_GLIDE_LENGTH

# If we are in compose mode and the arpeggiator is switched off, the gate is output even if
# the sequencer is stopped.
[ifequal]
    input1 = _T3_ARP
    input2 = 0
    ifequal = _RUNNING + _COMPOSEMODE
    else = _RUNNING
    output = _RUNNING_OR_COMPOSE_3

# Copy the gate to its final destination
[copy]
    input = _T3_MUTED_GATE * _RUNNING_OR_COMPOSE_3
    output = _T3_FINAL_GATE

# Copy the gate signal to the CV jack
[copy]
    input = _T3_FINAL_GATE
    output = G1.3

# Names for the display
[switch]
    input1 = "a"
    input2 = "a a a c"
    input3 = "a a c c"
    offset = _T3_FORM
    output1 = _T3_FORM_NAME

# Display the name of 'Song form' when edited
[display]
    linger = 0.1
    header = "SONG FORM"
    text = _T3_FORM_NAME
    fontsize = 4

# Names for the display
[ifequal]
    input1 = _T3_12TONE
    input2 = 0
    ifequal = "diatonic"
    else = "chromatic"
    output = _T3_12TONE_NAME

# Display the name of 'Scale' when edited
[display]
    linger = 0.1
    header = "SCALE"
    text = _T3_12TONE_NAME
    fontsize = 2

# Show a message when _T3_CLEARSTARTEND triggers
[display]
    trigger = _T3_CLEARSTARTEND
    text = "Reset start/end"

# Show a message when _T3_PEACE triggers
[display]
    trigger = _T3_PEACE
    text = "Track 3 peace"

# Show a message when _T3_CLEAR triggers
[display]
    trigger = _T3_CLEAR
    text = "Track 3 cleared"

# Names for the display
[ifequal]
    input1 = _T3_ARP
    input2 = 0
    ifequal = "Sequencer"
    else = "Arpeggiator"
    output = _T3_ARP_NAME

# Display the name of '' when edited
[display]
    linger = 0.1
    header = ""
    text = _T3_ARP_NAME
    fontsize = 2

