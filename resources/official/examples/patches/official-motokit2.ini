    input7 = "Mrandom"
    offset = _T1_ARP_PATTERN
    output1 = _T1_ARP_PATTERN_NAME

# Display the name of 'Movement pattern' when edited
[display]
    linger = 0.1
    header = "MOVEMENT PATTERN"
    text = _T1_ARP_PATTERN_NAME
    fontsize = 5

# Select one of four different drop patterns
