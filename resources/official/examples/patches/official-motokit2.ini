# Melody sequencer with 4 tracks
# LABELS: master=18
# INPUTS:
#  I1: [CLK In] External clock
#  I2: [RST In] Reset all sequences to step 1 on a gate or trigger here

# OUTPUTS:
#  O1: [V/O 1] Pitch CV output track 1
#  O2: [Velo 1] Modulation CV output track 1
#  O3: [V/O 2] Pitch CV output track 2
#  O4: [Velo 2] Modulation CV output track 2
#  O5: [V/O 3] Pitch CV output track 3
#  O6: [Velo 3] Modulation CV output track 3
#  O7: [V/O 4] Pitch CV output track 4
#  O8: [Velo 4] Modulation CV output track 4

# GATES ON MODULE 1:
#  G1.1: [Gate 1] Gate output track 1
#  G1.2: [Gate 2] Gate output track 2
#  G1.3: [Gate 3] Gate output track 3
#  G1.4: [Gate 4] Gate output track 4

# CONTROLLER 1:
#  B1.1: [ROOT] Allow root note
#  B1.2: [3RD] Allow third note
#  B1.3: [5TH] Allow fifth note
#  B1.4: [7TH] Allow seventh note
#  B1.5: [9TH] Allow nineth note
#  B1.6: [11TH] Allow eleventh note
#  B1.7: [13TH] Allow thirtheenth note
#  B1.8: [CTRL] Switch some of the button functions

# CONTROLLER 2:
#  B2.1: [Preset A] Ctrl: Switch to preset A, long press: save to preset A
#  B2.2: [Preset B] Ctrl: Switch to preset B, long press: save to preset B
#  B2.3: [Preset C] Ctrl: Switch to preset C, long press: save to preset C
#  B2.4: [CLR] Short press: reset play mode, with CTRL: clear track, long press factory reset
#  B2.5: [TBR] If enabled, transposes the melody when the root note changes.
#  B2.6: [INV] Invert the melody (change low to high and vice versa)
#  B2.7: [AAAB] Switch between the song from A, AAAB and AABB
#  B2.8: [CHRO] Disable scale and note selection, allow all 12 notes
#  B2.9: [ARP] Switch this track to arpeggio mode
#  B2.10: [LUCK] Randomly change step buttons, if Ctrl is held, change the gates instead.
#  B2.11: [RST] Reset current track (Ctrl: all track) to step 1 immediately
#  B2.12: [START] Start/stop sequencer - start also does reset
#  B2.13: [TON] Tonality menu
#  B2.14: [CLK] Menu for clock speed and swing
#  B2.15: [TRK] Track menu
#  B2.16: [PERF] Performance menu
#  B2.17: [RATC] Number of sub gates per clock
#  B2.18: [REP] Number of repeats, skip steps
#  B2.19: [PAT] Pattern for repeated gates
#  B2.20: [S/E] Set start and end (range of steps to play)
#  B2.21: [RAND] Pitch randomization
#  B2.22: [ACT] Set step activities
#  B2.23: [PROB] Gate probability
#  B2.24: [COPY] Copy current page of current track. With CTRL: Paste
#  B2.25: [NOTE] Set motor faders to pitch
#  B2.26: [VELO] Velocity / Additional gate
#  B2.27: [GL] Gate length and glide
#  B2.28: [PAGE] Select second page of steps
#  B2.29: [Track 1] Select track 1
#  B2.30: [Track 2] Select track 2
#  B2.31: [Track 3] Select track 3
#  B2.32: [Track 4] Select track 4

[db8e]
[b32]
[m4]
[m4]

# -------------------------------------------------
# Tonality
# -------------------------------------------------

# Mix together all sources for the root note
[mixer]
    input1 = _ROOT_FADER
    input2 = _MIDI_IN_ROOT_PITCH * 120
    output = _ROOT

# Mix together sources for the scale
[mixer]
    input1 = _DEGREE_FADER
    input2 = _MIDI_IN_SCALE_CC * 127
    output = _DEGREE

# Set the root note (from C, C#, D, ... to C again)
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 97
    fader = 1
    notches = 13
    ledcolor = 1.1
    ledvalue = 1
    output = _ROOT_FADER

# Names for the display
[switch]
    input1 = "C"
    input2 = "C#"
    input3 = "D"
    input4 = "D#"
    input5 = "E"
    input6 = "F"
    input7 = "F#"
    input8 = "G"
    input9 = "G#"
    input10 = "A"
    input11 = "A#"
    input12 = "B"
    offset = _ROOT_FADER
    output1 = _ROOT_NAME

# Display the name of 'Root note' when edited
[display]
    linger = 0.1
    header = "ROOT NOTE"
    text = _ROOT_NAME
    fontsize = 4

# Set the musical scale
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 97
    fader = 2
    notches = 12
    startvalue = 0
    ledcolor = _COLOR_DEGREE_FADER
    ledvalue = 1
    output = _DEGREE_FADER

# Names for the display
[switch]
    input1 = "lydian major"
    input2 = "natuarl major"
    input3 = "mixolydian"
    input4 = "mixolyd. sus4"
    input5 = "altered"
    input6 = "spanish/hm5"
    input7 = "dorian minor"
    input8 = "natural minor"
    input9 = "harmonic minor"
    input10 = "phrygian minor"
    input11 = "diminished"
    input12 = "augmented"
    offset = _DEGREE_FADER
    output1 = _SCALE_NAME

# Display the name of 'Scale' when edited
[display]
    linger = 0.1
    header = "SCALE"
    text = _SCALE_NAME
    fontsize = 2

# Select the color for the scale fader
[multicompare]
    input = _DEGREE_FADER
    compare1 = 0
    ifequal1 = 0.5
    compare2 = 1
    ifequal2 = 0.4
    compare3 = 2
    ifequal3 = 0.73
    compare4 = 6
    ifequal4 = 0.2
    compare5 = 7
    ifequal5 = 1.2
    compare6 = 9
    ifequal6 = 1.1
    else = 0
    output = _COLOR_DEGREE_FADER

# Global octave switch for all tracks
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 97
    fader = 3
    notches = 5
    startvalue = 2
    ledcolor = 0.2
    ledvalue = -0.3
    output = _GLOBAL_OCTAVE_SWITCH
    button = _RESET_OCTAVE_SWITCH
    clear = _RESET_OCTAVE_SWITCH

# Names for the display
[switch]
    input1 = "2 octaves down"
    input2 = "1 octave down"
    input3 = "no octaving"
    input4 = "1 octave up"
    input5 = "2 octaves up"
    offset = _GLOBAL_OCTAVE_SWITCH
    output1 = _GLOBAL_OCT_SWITCH_NAME

# Display the name of 'Octave switch' when edited
[display]
    linger = 0.1
    header = "OCTAVE SWITCH"
    text = _GLOBAL_OCT_SWITCH_NAME
    fontsize = 2

# Global diatonic transposition for all tracks
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 97
    fader = 4
    notches = 15
    outputoffset = -7
    startvalue = 7
    ledcolor = 0.4
    ledvalue = -0.3
    output = _GLOBAL_NOTESHIFT
    button = _RESET_NOTESHIFT
    clear = _RESET_NOTESHIFT
    header = "DIATONIC TRANSPOSE"

# Prevent the pitch to change between clock ticks
[sample]
    input = _GLOBAL_NOTESHIFT
    sample = _CLOCK
    output = _GLOBAL_NOTESHIFT_CLOCKED

# Global transposition by semitones for all tracks
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 97
    fader = 5
    notches = 25
    startvalue = 12
    outputoffset = -12
    ledcolor = 0.85
    ledvalue = -0.3
    output = _GLOBAL_TRANSPOSITION
    button = _RESET_TRANSPOSITION
    clear = _RESET_TRANSPOSITION
    header = "TRANSPOSITION"

# Global transposition by semitones for all tracks
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 97
    fader = 6
    notches = 3
    startvalue = 0
    ledcolor = 0
    ledvalue = _TUNING_LED + 0.3
    output = _TUNING_COMPOSE
    display = 0

# Names for the display
[switch]
    input1 = "Normal"
    input2 = "Tuning mode"
    input3 = "Compose mode"
    offset = _TUNING_COMPOSE
    output1 = _TUNING_NAME

# Display the name of 'Tuning / Compose' when edited
[display]
    linger = 0.1
    header = "TUNING / COMPOSE"
    text = _TUNING_NAME
    fontsize = 2

# Make tuning mode or compose mode active depending on the fader position.
[switch]
    input1 = 1
    offset = _TUNING_COMPOSE
    output2 = _COMPOSEMODE
    output3 = _TUNINGMODE

# Let the LED blink so that we are aware of the special mode
[lfo]
    hz = 5
    level = 0.7 * _TUNING_COMPOSE
    square = _TUNING_LED

# Glide length (duration of slides)
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 97
    fader = 7
    startvalue = 0.3
    ledcolor = 0.5
    ledvalue = 1
    output = _T1_GLIDE_LENGTH_FADER
    header = "GLIDE DURATION"

# Make glide reasonably fast, make fader curve zoomed in in the short glide times.
[math]
    input1 = _T1_GLIDE_LENGTH_FADER * 0.5
    input2 = 3
    power = _T1_GLIDE_LENGTH

# Set the CV range for track 1
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 97
    fader = 8
    notches = 6
    startvalue = 1
    ledcolor = 0.65
    ledvalue = _TUNING_LED + 0.3
    outputoffset = 1
    output = _T1_CVRANGE
    header = "Range (octaves)"

# Glide length (duration of slides)
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 194
    fader = 7
    startvalue = 0.3
    ledcolor = 0.5
    ledvalue = 1
    output = _T2_GLIDE_LENGTH_FADER
    header = "GLIDE DURATION"

# Make glide reasonably fast, make fader curve zoomed in in the short glide times.
[math]
    input1 = _T2_GLIDE_LENGTH_FADER * 0.5
    input2 = 3
    power = _T2_GLIDE_LENGTH

# Set the CV range for track 2
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 194
    fader = 8
    notches = 6
    startvalue = 1
    ledcolor = 0.65
    ledvalue = _TUNING_LED + 0.3
    outputoffset = 1
    output = _T2_CVRANGE
    header = "Range (octaves)"

# Glide length (duration of slides)
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 291
    fader = 7
    startvalue = 0.3
    ledcolor = 0.5
    ledvalue = 1
    output = _T3_GLIDE_LENGTH_FADER
    header = "GLIDE DURATION"

# Make glide reasonably fast, make fader curve zoomed in in the short glide times.
[math]
    input1 = _T3_GLIDE_LENGTH_FADER * 0.5
    input2 = 3
    power = _T3_GLIDE_LENGTH

# Set the CV range for track 3
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 291
    fader = 8
    notches = 6
    startvalue = 1
    ledcolor = 0.65
    ledvalue = _TUNING_LED + 0.3
    outputoffset = 1
    output = _T3_CVRANGE
    header = "Range (octaves)"

# Glide length (duration of slides)
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 388
    fader = 7
    startvalue = 0.3
    ledcolor = 0.5
    ledvalue = 1
    output = _T4_GLIDE_LENGTH_FADER
    header = "GLIDE DURATION"

# Make glide reasonably fast, make fader curve zoomed in in the short glide times.
[math]
    input1 = _T4_GLIDE_LENGTH_FADER * 0.5
    input2 = 3
    power = _T4_GLIDE_LENGTH

# Set the CV range for track 4
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 388
    fader = 8
    notches = 6
    startvalue = 1
    ledcolor = 0.65
    ledvalue = _TUNING_LED + 0.3
    outputoffset = 1
    output = _T4_CVRANGE
    header = "Range (octaves)"

# -------------------------------------------------
# MIDI input
# -------------------------------------------------

# MIDI input for clock, start and stop
[midiin]
    trs = 10
    usb = 10
    start = _EXT_RUNNING_STARTED
    stop = _EXT_RUNNING_STOPPED
    clock = _MIDI_INPUT_CLOCK
    running = _RUNNING_EXT

# Detect a MIDI input clock signal if within the last 2 seconds there is a pulse
[gatetool]
    inputtrigger = _MIDI_INPUT_CLOCK
    gatelength = 2
    outputgate = _MIDI_INPUT_CLOCK_PRESENT

# Get root and scale via MIDI
[midiin]
    trs = 1
    pitch1 = _MIDI_IN_ROOT_PITCH
    ccnumber1 = 1
    cc1 = _MIDI_IN_SCALE_CC

# -------------------------------------------------
# Clocking
# -------------------------------------------------

# Selects 100s of BPM
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 99
    fader = 1
    notches = 3
    output = _CLOCK_BPM_100
    startvalue = 1
    ledcolor = 0.2
    ledvalue = 1
    display = 0

# Selects 10s of BPM
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 99
    fader = 2
    notches = 10
    output = _CLOCK_BPM_10
    startvalue = 2
    ledcolor = 0.2
    ledvalue = 1
    display = 0

# Selects 1s of BPM
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 99
    fader = 3
    notches = 10
    output = _CLOCK_BPM_1
    startvalue = 0
    ledcolor = 0.2
    ledvalue = 1
    display = 0

# Clock bend half speed / double speed. Touch button to reset.
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 99
    fader = 4
    output = _CLOCK_BEND_FADER
    startvalue = 0.5
    ledcolor = _CLOCK_BEND_COLOR
    ledvalue = 1
    button = _RESET_CLOCK_BEND
    clear = _RESET_CLOCK_BEND
    display = 0

# Snap to the perfectly neutral position if the fader is almost there.
[pot]
    pot = _CLOCK_BEND_FADER
    notch = 0.01
    output = _CLOCK_BEND
    display = 0

# Let the LED light bright if the bending alteration is exactly zero.
[ifequal]
    input1 = _CLOCK_BEND
    input2 = 0.5
    ifequal = 0.4
    else = 0.8
    output = _CLOCK_BEND_COLOR

# Add up all three BPM faders
[mixer]
    input1 = _CLOCK_BPM_100 * 100
    input2 = _CLOCK_BPM_10 * 10
    input3 = _CLOCK_BPM_1
    output = _CLOCK_BPM_THREE_FADERS

# Clock swing (shuffle)
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 99
    fader = 5
    output = _CLOCK_SWING
    ledcolor = 1.1
    ledvalue = _CLOCK_SWING * 0.9 + 0.1
    header = "SWING"

# Small hack for letting the user toggle the state with the touch button
[switch]
    input1 = _INT_CLOCK_UNMUTED
    input2 = 0
    offset = B2.4
    output1 = _CLOCK_MUTE_STARTVALUE

# Mute the clock, switch to external clocks if present. Touch button to toggle.
[motorfader]
    select = _GLOBAL_FADER_SELECTION
    selectat = 99
    fader = 6
    notches = 2
    output = _INT_CLOCK_UNMUTED
    button = _TOGGLE_CLOCK_MUTE
    clear = _TOGGLE_CLOCK_MUTE
    startvalue = -1 * _CLOCK_MUTE_STARTVALUE + 1
    ledcolor = _INT_CLOCK_UNMUTED * -0.4 + 0.8
    ledvalue = 1

# Names for the display
[ifequal]
    input1 = _INT_CLOCK_UNMUTED
    input2 = 0
    ifequal = "stopped"
    else = "running"
    output = _INT_CLOCK_STATE_NAME

# Display the name of 'Internal clock' when edited
[display]
    linger = 0.1
    header = "INTERNAL CLOCK"
    text = _INT_CLOCK_STATE_NAME
    fontsize = 2

# Disable this unused fader
[unusedfaders]
    select = _GLOBAL_FADER_SELECTION
    selectat = 99
    firstfader = 7

# Range of pitch accumulator
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 99
    fader = 8
    startvalue = 3
    notches = 17
    ledcolor = 1.2
    ledvalue = 1
    output = _T1_ACCU_RANGE
    header = "ACCU CYCLES"

# Range of pitch accumulator
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 198
    fader = 8
    startvalue = 3
    notches = 17
    ledcolor = 1.2
    ledvalue = 1
    output = _T2_ACCU_RANGE
    header = "ACCU CYCLES"

# Range of pitch accumulator
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 297
    fader = 8
    startvalue = 3
    notches = 17
    ledcolor = 1.2
    ledvalue = 1
    output = _T3_ACCU_RANGE
    header = "ACCU CYCLES"

# Range of pitch accumulator
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _SELECTED_TRACK
    selectat = 396
    fader = 8
    startvalue = 3
    notches = 17
    ledcolor = 1.2
    ledvalue = 1
    output = _T4_ACCU_RANGE
    header = "ACCU CYCLES"

# Split clock bending fader in two hemispheres, so the the lower one is linear and can go to
# 0 Hz, while the upper half is going to exactly double speed.
[pot]
    pot = _CLOCK_BEND
    lefthalfinv = _CLOCK_BEND_LINEAR
    righthalf = _CLOCK_BEND_EXP

[math]
    input1 = 2
    input2 = _CLOCK_BEND_EXP
    power = _CLOCK_BEND_FACTOR

[copy]
    input = _CLOCK_BPM_THREE_FADERS * _CLOCK_BEND_LINEAR
    output = _CLOCK_BPM_LINEAR

[copy]
    input = _CLOCK_BPM_LINEAR * _CLOCK_BEND_FACTOR
    output = _CLOCK_BPM_UNMUTED

# Display current BPM setting
[display]
    value = _CLOCK_BPM_UNMUTED
    header = "CLOCK SPEED"
    fontsize = 3
    threshold = 0.1
    numbermode = 1

# Set the BPM to zero while the clock is muted.
[copy]
    input = _CLOCK_BPM_UNMUTED * _INT_CLOCK_UNMUTED
    output = _CLOCK_BPM

# The actual clock, use a very short pulse so we have essentially just triggers
[lfo]
    hz = _CLOCK_BPM / 15
    pulsewidth = 0.1
    square = _INT_CLOCK
    sync = _RUNNING

# Detect an external clock signal, if within the last 2 seconds there was a trigger
[gatetool]
    inputtrigger = I1
    gatelength = 2
    outputgate = _EXTERNAL_CLOCK_PRESENT

# Select first avaiable clock in defined precedence order
[case]
    case1 = _MIDI_INPUT_CLOCK_PRESENT
    value1 = _MIDI_INPUT_CLOCK
    case2 = _INT_CLOCK_UNMUTED
    value2 = _INT_CLOCK
    case3 = _EXTERNAL_CLOCK_PRESENT
    value3 = I1
    output = _CLOCK_UNSWUNG

# Apply swing to the clock
[timing]
    clock = _CLOCK_UNSWUNG
    reset = _RESET
    timing1 = 0
    timing2 = _CLOCK_SWING * 0.33
    output = _CLOCK

# Pulses for changes via lucky buttons / lucky faders
[lfo]
    hz = 40
    square = _LUCKY_CLOCK

# Clock division 3/2 for the arpeggiators
[clocktool]
    clock = _CLOCK
    output = _CLOCK_3_2
    multiply = 3
    divide = 2

# Clock division 2/1 for the arpeggiators
[clocktool]
    clock = _CLOCK
    output = _CLOCK_2_1
    multiply = 2
    divide = 1

# Clock division 3/1 for the arpeggiators
[clocktool]
    clock = _CLOCK
    output = _CLOCK_3_1
    multiply = 3
    divide = 1

# Clock division 4/1 for the arpeggiators
[clocktool]
    clock = _CLOCK
    output = _CLOCK_4_1
    multiply = 4
    divide = 1

# Clock division 6/1 for the arpeggiators
[clocktool]
    clock = _CLOCK
    output = _CLOCK_6_1
    multiply = 6
    divide = 1

# Clock division 8/1 for the arpeggiators
[clocktool]
    clock = _CLOCK
    output = _CLOCK_8_1
    multiply = 8
    divide = 1

# Names for the display
[ifequal]
    input1 = _RUNNING
    input2 = 0
    ifequal = "Stopped"
    else = "Started"
    output = _RUNNING_NAME

# Display the name of '' when edited
[display]
    linger = 0.1
    header = ""
    text = _RUNNING_NAME
    fontsize = 2

# -------------------------------------------------
# Global buttons
# -------------------------------------------------

# A long press on the clear button resets all settings of the sequencer to its default state
[button]
    button = B2.4
    states = 1
    longpress = _FACTORY_RESET

# Do the factory reset
[droid]
    clearall = _FACTORY_RESET

# Animation of track buttons when muted.
[lfo]
    level = 0.8
    bipolar = 0
    square = _MUTE_BLINK
    pulsewidth = 0.2
    hz = 2.5

# Mute button for track 1 (same as track button)
[button]
    select = _CONTROL
    button = B2.29
    led = L2.29
    output = _T1_MUTED

# Names for the display
[ifequal]
    input1 = _T1_MUTED
    input2 = 0
    ifequal = "T1 unmuted"
    else = "T1 muted"
    output = _T1_MUTED_NAME

# Display the name of '' when edited
[display]
    linger = 0.1
    header = ""
    text = _T1_MUTED_NAME
    fontsize = 2

# Compute state of track LED based on wether it is selected and/or muted
[switch]
    offset = _T1_SELECTED * 2 + _T1_MUTED
    input1 = 0
    input2 = _MUTE_BLINK
    input3 = 1
    input4 = -1 * _MUTE_BLINK + 1
    output1 = _T1_TRACKLED

# Show mute state of track while CTRL is held
[ifequal]
    input1 = _CONTROL
    input2 = 1
    ifequal = _T1_MUTED
    else = _T1_TRACKLED
    output = L2.29

# Mute button for track 2 (same as track button)
[button]
    select = _CONTROL
    button = B2.30
    led = L2.30
    output = _T2_MUTED

# Names for the display
[ifequal]
    input1 = _T2_MUTED
    input2 = 0
    ifequal = "T2 unmuted"
    else = "T2 muted"
    output = _T2_MUTED_NAME

# Display the name of '' when edited
[display]
    linger = 0.1
    header = ""
    text = _T2_MUTED_NAME
    fontsize = 2

# Compute state of track LED based on wether it is selected and/or muted
[switch]
    offset = _T2_SELECTED * 2 + _T2_MUTED
    input1 = 0
    input2 = _MUTE_BLINK
    input3 = 1
    input4 = -1 * _MUTE_BLINK + 1
    output1 = _T2_TRACKLED

# Show mute state of track while CTRL is held
[ifequal]
    input1 = _CONTROL
    input2 = 1
    ifequal = _T2_MUTED
    else = _T2_TRACKLED
    output = L2.30

# Mute button for track 3 (same as track button)
[button]
    select = _CONTROL
    button = B2.31
    led = L2.31
    output = _T3_MUTED

# Names for the display
[ifequal]
    input1 = _T3_MUTED
    input2 = 0
    ifequal = "T3 unmuted"
    else = "T3 muted"
    output = _T3_MUTED_NAME

# Display the name of '' when edited
[display]
    linger = 0.1
    header = ""
    text = _T3_MUTED_NAME
    fontsize = 2

# Compute state of track LED based on wether it is selected and/or muted
[switch]
    offset = _T3_SELECTED * 2 + _T3_MUTED
    input1 = 0
    input2 = _MUTE_BLINK
