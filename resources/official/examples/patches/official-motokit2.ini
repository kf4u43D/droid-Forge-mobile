    trs = 1
    velocity1 = _T1_VELOCITY
    channel = 1
    pitch1 = _T1_FINAL_PITCH
    gate1 = _T1_FINAL_GATE
    activesensing = 0

# MIDI output for track 2
[midiout]
    trs = 2
    velocity1 = _T2_VELOCITY
    channel = 2
    pitch1 = _T2_FINAL_PITCH
    gate1 = _T2_FINAL_GATE
    activesensing = 0

# MIDI output for track 3
[midiout]
    usb = 1
    velocity1 = _T3_VELOCITY
    channel = 3
    pitch1 = _T3_FINAL_PITCH
    gate1 = _T3_FINAL_GATE
    activesensing = 0

# MIDI output for track 4
[midiout]
    usb = 1
    velocity1 = _T4_VELOCITY
    channel = 4
    pitch1 = _T4_FINAL_PITCH
    gate1 = _T4_FINAL_GATE
    activesensing = 0

# Show a message when _RESET_BUTTON triggers
