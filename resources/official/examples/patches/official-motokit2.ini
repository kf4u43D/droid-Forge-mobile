# Select one of several clocking patterns
[motorfader]
    select = _GLOBAL_FADER_SELECTION * _T1_ARP
    selectat = 11
    loadpreset = _T1_LOAD_PRESET
    savepreset = _T1_SAVE_PRESET
    fader = 8
    notches = 8
    ledcolor = 1.1
