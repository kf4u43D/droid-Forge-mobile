    output = _T2_LOAD_PRESET

# Create a trigger with the preset as value when any of the presets is saved
[mixer]
    input1 = _T2_P1_SAVE * 1
    input2 = _T2_P2_SAVE * 2
    input3 = _T2_P3_SAVE * 3
    output = _T2_SAVE_PRESET

# Select which notes from the current scale should be played
[buttongroup]
    select = _SELECTED_TRACK
    selectat = 2
    minactive = 1
    maxactive = _CONTROL * -6 + 7
    startbutton = -1
    button1 = B1.1
    led1 = L1.1
    buttonoutput1 = _T2_SEL_1
    button2 = B1.2
    led2 = L1.2
    buttonoutput2 = _T2_SEL_2
    button3 = B1.3
    led3 = L1.3
    buttonoutput3 = _T2_SEL_3
    button4 = B1.4
    led4 = L1.4
    buttonoutput4 = _T2_SEL_4
    button5 = B1.5
    led5 = L1.5
    buttonoutput5 = _T2_SEL_5
    button6 = B1.6
    led6 = L1.6
    buttonoutput6 = _T2_SEL_6
    button7 = B1.7
    led7 = L1.7
    buttonoutput7 = _T2_SEL_7

# Clock divider for track 2
[clocktool]
    clock = _CLOCK
    reset = _RESET
    divide = _T2_CD_EVEN_DIV * _T2_CD_ODD_DIV
    multiply = _T2_CD_EVEN_MULT * _T2_CD_ODD_MULT
    output = _T2_CLOCK

# Mix global and per-track diatonic transposition
[mixer]
    input1 = _T2_NOTESHIFT_CLOCKED
    input2 = _GLOBAL_NOTESHIFT_CLOCKED
    output = _T2_NOTESHIFT_SUM

# The clear range logic should just affect the current track
[ifequal]
    input1 = _SELECTED_TRACK * _RANGE
    input2 = 2
    ifequal = 1
    output = _T2_CLEAR_RANGE

# Collect different sources of resetting the start/end point
[logic]
    input1 = _T2_CLEAR + _T2_PEACE
    input2 = _T2_CLEAR_RANGE * _CONTROL
    or = _T2_CLEARSTARTEND

# Select encoder if track 2 is selected, arp is off and control is not held
[logic]
    input1 = _T2_SELECTED * _NO_CONTROL
    input2 = _T2_ARP_OFF
    and = _T2_ENC_1_SELECTED

# Note shift for each step repetition
[encoder]
    select = _T2_ENC_1_SELECTED
    encoder = 1
    header = "Repeat shift"
    color = 0.6
    discrete = 15
    startvalue = 7
    outputoffset = -7
    output = _T2_REPEATSHIFT

# Select encoder if track 2 is selected, arp is off and control is held
[logic]
    input1 = _T2_SELECTED * _CONTROL
    input2 = _T2_ARP_OFF
    and = _T2_ENC_2_SELECTED

# Note shift for each ratchet
[encoder]
    select = _T2_ENC_2_SELECTED
    encoder = 1
    header = "Ratchet shift"
    color = 0.8
    discrete = 15
    startvalue = 7
    outputoffset = -7
    output = _T2_RATCHETSHIFT

# Sequencer for pitch and gate of track 2
[motoquencer]
    select = _GLOBAL_FADER_SELECTION
    selectat = 2
    page = _PAGE
    stepcopy = _T2_COPY_BUTTON
    doublerange = _T2_COPY_BUTTON
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    clear = _T2_CLEAR
    select1 = _T2_SEL_1 + _T2_12TONE
    select3 = _T2_SEL_2 + _T2_12TONE
    select5 = _T2_SEL_3 + _T2_12TONE
    select7 = _T2_SEL_4 + _T2_12TONE
    select9 = _T2_SEL_5 + _T2_12TONE
    select11 = _T2_SEL_6 + _T2_12TONE
    select13 = _T2_SEL_7 + _T2_12TONE
    selectfill1 = _T2_12TONE
    selectfill2 = _T2_12TONE
    selectfill3 = _T2_12TONE
    selectfill4 = _T2_12TONE
    selectfill5 = _T2_12TONE
    degree = _DEGREE
    clock = _T2_CLOCK * _RUNNING
    taptempo = _T2_CLOCK
    reset = _RESET + _T2_RESET
    cv = _T2_PITCH
    cvrange = _T2_CVRANGE * 1V
    defaultgate = 0
    gate = _T2_SEQUENCER_GATE
    numfaders = 8
    numsteps = 16
    linktonext = 1
    autoreset = _T2_AUTORESET
    shiftsteps = _T2_SHIFTSTEPS
    pattern = -1 * 2 + _T2_PATTERN_FADER
    direction = _T2_DIRECTION
    pingpong = _T2_PINGPONG
    selectnoteshift = _T2_NOTESHIFT_SUM
    tuningmode = _TUNINGMODE
    tuningpitch = 1V
    bulkedit = _CONTROL
    constantlength = B2.18
    accumulatorrange = _T2_ACCU_RANGE
    root = _ROOT * _T2_TBR_OFF
    transpose = _T2_TBR
    luckybuttons = _T2_LUCKY * _CONTROL
    luckyfaders = _T2_LUCKY * _NO_CONTROL
    luckychance = 1 / 8
    luckyamount = 0.5 * _NO_CONTROL + 0.5
    luckyscope = 3
    fadermode = _FADERMODE
    mute = -1 * _RUNNING + 1
    form = _T2_FORM
    invert = _T2_INVERT
    gatelength = _T2_GATELENGTH
    buttonmode = _BUTTONMODE
    composemode = _COMPOSEMODE
    clearskips = _T2_CLEAR + _T2_PEACE
    clearrepeats = _T2_CLEAR + _T2_PEACE
    clearstartend = _T2_CLEARSTARTEND
    repeatshift = _T2_REPEATSHIFT
    ratchetshift = _T2_RATCHETSHIFT
    startofsequence = _T2_START_OF_SEQUENCE

# Sequencer for velocity
[motoquencer]
    select = _GLOBAL_FADER_SELECTION
    selectat = 2
    page = _PAGE
    stepcopy = _T2_COPY_BUTTON
    doublerange = _T2_COPY_BUTTON
    clear = _T2_CLEAR
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    cv = _T2_VELOCITY
    defaultcv = 5.5V
    cvbase = 1V
    cvrange = 9V
    quantize = 0
    cvname = "Velocity"
    bulkedit = _CONTROL
    linktonext = 1

# Copy velocity to CV output
[copy]
    input = _T2_VELOCITY
    output = O4

# Sequencer for gate length and glide
[motoquencer]
    select = _GLOBAL_FADER_SELECTION
    selectat = 2
    page = _PAGE
    stepcopy = _T2_COPY_BUTTON
    doublerange = _T2_COPY_BUTTON
    clear = _T2_CLEAR
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    cv = _T2_GATELENGTH
    cvbase = 0.05
    cvrange = 0.9
    defaultcv = 0.5
    defaultgate = 0
    quantize = 0
    buttoncolor = 0.5
    cvname = "Gate length"
    bulkedit = _CONTROL
    linktonext = 1
    gate = _T2_GLIDE
    gatename = "Glide"

# Sequencer for activity level per step
[motoquencer]
    select = _GLOBAL_FADER_SELECTION
    selectat = 2
    clear = _T2_CLEAR
    loadpreset = _T2_LOAD_PRESET
    savepreset = _T2_SAVE_PRESET
    cv = _T2_STEP_ACTIVITY
    quantize = 0
    defaultcv = 7
    cvname = "Activity"
    cvnotches = 8
    bulkedit = _CONTROL

# Silence the gate if the step does not reach the required activity
[compare]
    input = _T2_STEP_ACTIVITY
    compare = _T2_ACTIVITY
    ifless = 0
    else = _T2_SEQUENCER_GATE
    output = _T2_ACT_GATE

# Modulate gate length for gate output in arpeggiator mode
[gatetool]
    taptempo = _T2_ARP_TAPTEMPO
    gatelength = _T2_GATELENGTH
    inputgate = _T2_ARP_CLOCK
    outputgate = _T2_ARP_MODULATED_GATE

# Switch gate to arpeggiator if active
[ifequal]
    input1 = _T2_ARP_SYNCED
    input2 = 0
    ifequal = _T2_ACT_GATE
    else = _T2_ARP_MODULATED_GATE
    output = _T2_SWITCHED_GATE

# Logic for make the gate silent if the track is muted
[logic]
    input1 = -1 * _T2_MUTED + 1
    input2 = _T2_SWITCHED_GATE
    and = _T2_MUTED_GATE

# Select clock for arpeggiator of track 2. It is either the master clock or a multiplication
# of it, or the sequencer gate output.
[switch]
    input1 = _CLOCK
    input2 = _T2_SEQUENCER_GATE
    input3 = _CLOCK_3_2
    input4 = _CLOCK_2_1
    input5 = _CLOCK_3_1
    input6 = _CLOCK_4_1
    input7 = _CLOCK_6_1
    input8 = _CLOCK_8_1
    output1 = _T2_ARP_CLOCK
    offset = _T2_ARP_CLOCKING

# Create taptempo for arp clock to be used for gate length
[switch]
    input1 = _CLOCK
    input2 = _T2_CLOCK
    input3 = _CLOCK_3_2
    input4 = _CLOCK_2_1
    input5 = _CLOCK_3_1
    input6 = _CLOCK_4_1
    input7 = _CLOCK_6_1
    input8 = _CLOCK_8_1
    output1 = _T2_ARP_TAPTEMPO
    offset = _T2_ARP_CLOCKING * _T2_ARP

# Select encoder if track 2 is selected, arp is on and control is not held
[logic]
    input1 = _T2_SELECTED * _NO_CONTROL
    input2 = _T2_ARP
    and = _T2_ENC_3_SELECTED

# Encoder for base pitch of arpeggiator
[encoder]
    encoder = 1
    select = _T2_ENC_3_SELECTED
    header = "Arp base pitch"
    color = 0.2
    discrete = 37
    sensivity = 3
    output = _T2_ARP_PITCH

# Select encoder if track 2 is selected, arp is on and control is held
[logic]
    input1 = _T2_SELECTED * _CONTROL
    input2 = _T2_ARP
    and = _T2_ENC_4_SELECTED

# Encoder for pitch range of arpeggiator
[encoder]
    encoder = 1
    select = _T2_ENC_4_SELECTED
    header = "Arp pitch range"
    color = 0.4
    discrete = 49
    startvalue = 24
    sensivity = 4
    output = _T2_ARP_RANGE

# Arpeggiator for track 2
[arpeggio]
    select1 = _T2_SEL_1
    select3 = _T2_SEL_2
    select5 = _T2_SEL_3
    select7 = _T2_SEL_4
    select9 = _T2_SEL_5
    select11 = _T2_SEL_6
    select13 = _T2_SEL_7
    selectfill1 = 0
    selectfill2 = 0
    selectfill3 = 0
    selectfill4 = 0
    selectfill5 = 0
    root = _ROOT * _T2_TBR_OFF
    transpose = _T2_TBR
    degree = _DEGREE
    clock = _T2_ARP_CLOCK * _RUNNING
    reset = _RESET
    tuningmode = _TUNINGMODE
    direction = _T2_ARP_UPDOWN
    pingpong = _T2_ARP_PINGPONG
    butterfly = _T2_ARP_BUTTERFLY
    octaves = _T2_ARP_OCTAVING
    drop = _T2_ARP_DROP
    pattern = _T2_ARP_PATTERN
    autoreset = _T2_ARP_AUTORESET
    pitch = _T2_ARP_PITCH / 120
    range = _T2_ARP_RANGE / 120
    output = _T2_ARP_OUTPUT

# Switch pitch output between sequencer and arpeggiator
[ifequal]
    input1 = _T2_ARP_SYNCED
    input2 = 0
    ifequal = _T2_PITCH
    else = _T2_ARP_OUTPUT + _T2_ARP_OCTAVE
    output = _T2_SWITCHED_PITCH

# Mix all sources of pitch together
[mixer]
    input1 = _T2_OCTAVE * 1V - 2V
    input2 = _T2_SWITCHED_PITCH
    input3 = _GLOBAL_OCTAVE_SWITCH * 1V - 2V
    input4 = _GLOBAL_TRANSPOSITION * 0.00833333
    output = _T2_FINAL_PITCH

# Slew limiter for glides
[slew]
    input = _T2_FINAL_PITCH
    exponential = O3
    slew = _T2_GLIDE * _T2_GLIDE_LENGTH

# If we are in compose mode and the arpeggiator is switched off, the gate is output even if
# the sequencer is stopped.
[ifequal]
    input1 = _T2_ARP
    input2 = 0
    ifequal = _RUNNING + _COMPOSEMODE
    else = _RUNNING
    output = _RUNNING_OR_COMPOSE_2

# Copy the gate to its final destination
[copy]
    input = _T2_MUTED_GATE * _RUNNING_OR_COMPOSE_2
    output = _T2_FINAL_GATE

# Copy the gate signal to the CV jack
[copy]
    input = _T2_FINAL_GATE
    output = G1.2

# Names for the display
[switch]
    input1 = "a"
    input2 = "a a a c"
    input3 = "a a c c"
    offset = _T2_FORM
    output1 = _T2_FORM_NAME

# Display the name of 'Song form' when edited
[display]
    linger = 0.1
    header = "SONG FORM"
    text = _T2_FORM_NAME
    fontsize = 4

# Names for the display
[ifequal]
    input1 = _T2_12TONE
    input2 = 0
    ifequal = "diatonic"
    else = "chromatic"
    output = _T2_12TONE_NAME

# Display the name of 'Scale' when edited
[display]
    linger = 0.1
    header = "SCALE"
    text = _T2_12TONE_NAME
    fontsize = 2

# Show a message when _T2_CLEARSTARTEND triggers
[display]
    trigger = _T2_CLEARSTARTEND
    text = "Reset start/end"

# Show a message when _T2_PEACE triggers
[display]
    trigger = _T2_PEACE
    text = "Track 2 peace"

# Show a message when _T2_CLEAR triggers
[display]
    trigger = _T2_CLEAR
    text = "Track 2 cleared"

# Names for the display
[ifequal]
    input1 = _T2_ARP
    input2 = 0
    ifequal = "Sequencer"
    else = "Arpeggiator"
    output = _T2_ARP_NAME

# Display the name of '' when edited
[display]
    linger = 0.1
    header = ""
    text = _T2_ARP_NAME
    fontsize = 2

# -------------------------------------------------
# Track 3
# -------------------------------------------------

# Provide trigger when the clear button is pressed (no Ctrl needed)
[button]
    select = _SELECTED_TRACK
    selectat = 3
    button = B2.4
    shortpress = _T3_CLEAR_BUTTON
    states = 1

# Clear button with control together clears the track
[copy]
    input = _T3_CLEAR_BUTTON * _CONTROL
    output = _T3_CLEAR

# Clear button without control removes all mode that alter the pattern length
[logic]
    input1 = _T3_CLEAR_BUTTON
    input2 = -1 * _CONTROL + 1
    and = _T3_PEACE

# Five blinks for the clear LED
[burst]
    trigger = _T3_CLEAR + _FACTORY_RESET
    hz = 5
    count = 5
    output = _T3_CLEAR_LED

# LED only blinks when track is selected
[select]
    select = _SELECTED_TRACK
    selectat = 3
    input = _T3_CLEAR_LED + 0.3
    output = L2.4

# Reset track immediately
[button]
    select = _SELECTED_TRACK
    selectat = 3
    button = B2.11 * _NO_CONTROL
    states = 1
    output = _T3_RESET

# Show a message when _T3_RESET triggers
[display]
    trigger = _T3_RESET
    text = "Reset track 3"

# Button for copy and paste
[button]
    select = _SELECTED_TRACK
    selectat = 3
    button = B2.24
    states = 1
    output = _T3_COPY_BUTTON

# This button cycles between the song froms A, AAAB and AABB
[button]
    select = _SELECTED_TRACK
    selectat = 3
    clear = _T3_CLEAR
    loadpreset = _T3_LOAD_PRESET
    savepreset = _T3_SAVE_PRESET
    button = B2.7
    led = L2.7
    output = _T3_FORM
    states = 3

# Disables scale and note selection if on
