    input6 = "clock x 4"
    input7 = "clock x 6"
    input8 = "clock x 8"
    offset = _T1_ARP_CLOCKING
    output1 = _T1_ARP_CLOCKING_NAME

# Display the name of 'Arpeggio clocking' when edited
[display]
    linger = 0.1
    header = "ARPEGGIO CLOCKING"
    text = _T1_ARP_CLOCKING_NAME
    fontsize = 2

# Button for loading preset 1 on track 1
[button]
    select = _SELECTED_TRACK
    selectat = 1
    button = B2.1 * _CONTROL
    states = 1
    onvalue = 1
    output = _T1_P1_LOAD

# Button for saving preset 1 on track 1
[button]
    select = _SELECTED_TRACK
    selectat = 1
    button = B2.1
    states = 1
    onvalue = 1
    longpress = _T1_P1_SAVE

# Show a message when _T1_P1_LOAD triggers
[display]
    trigger = _T1_P1_LOAD
    text = "Preset 1 loaded"

# Show a message when _T1_P1_SAVE triggers
[display]
    trigger = _T1_P1_SAVE
    text = "Preset 1 saved"

# Five blinks for the LED of the preset button on saving
[burst]
    trigger = _T1_P1_SAVE
    hz = 5
    count = 5
    output = _T1_P1_SAVE_LED

# Write the save LED animation to the LED if the track is still selected.
[select]
    select = _SELECTED_TRACK
    selectat = 1
    input = _T1_P1_SAVE_LED + 0.3
    output = L2.1

# Button for loading preset 2 on track 1
[button]
    select = _SELECTED_TRACK
    selectat = 1
    button = B2.2 * _CONTROL
    states = 1
    onvalue = 2
    output = _T1_P2_LOAD

# Button for saving preset 2 on track 1
[button]
    select = _SELECTED_TRACK
    selectat = 1
    button = B2.2
    states = 1
    onvalue = 2
    longpress = _T1_P2_SAVE

# Show a message when _T1_P2_LOAD triggers
[display]
    trigger = _T1_P2_LOAD
    text = "Preset 2 loaded"

# Show a message when _T1_P2_SAVE triggers
[display]
    trigger = _T1_P2_SAVE
    text = "Preset 2 saved"

# Five blinks for the LED of the preset button on saving
[burst]
    trigger = _T1_P2_SAVE
    hz = 5
    count = 5
    output = _T1_P2_SAVE_LED

# Write the save LED animation to the LED if the track is still selected.
[select]
    select = _SELECTED_TRACK
    selectat = 1
    input = _T1_P2_SAVE_LED + 0.3
    output = L2.2

# Button for loading preset 3 on track 1
[button]
    select = _SELECTED_TRACK
    selectat = 1
    button = B2.3 * _CONTROL
    states = 1
    onvalue = 3
    output = _T1_P3_LOAD

# Button for saving preset 3 on track 1
[button]
    select = _SELECTED_TRACK
    selectat = 1
    button = B2.3
    states = 1
    onvalue = 3
    longpress = _T1_P3_SAVE

# Show a message when _T1_P3_LOAD triggers
[display]
    trigger = _T1_P3_LOAD
    text = "Preset 3 loaded"

# Show a message when _T1_P3_SAVE triggers
[display]
    trigger = _T1_P3_SAVE
    text = "Preset 3 saved"

# Five blinks for the LED of the preset button on saving
[burst]
    trigger = _T1_P3_SAVE
    hz = 5
    count = 5
    output = _T1_P3_SAVE_LED

# Write the save LED animation to the LED if the track is still selected.
[select]
    select = _SELECTED_TRACK
    selectat = 1
    input = _T1_P3_SAVE_LED + 0.3
    output = L2.3

# Create a trigger with the preset as value when any of the presets is loaded
[mixer]
    input1 = _T1_P1_LOAD
    input2 = _T1_P2_LOAD
    input3 = _T1_P3_LOAD
    output = _T1_LOAD_PRESET

# Create a trigger with the preset as value when any of the presets is saved
[mixer]
    input1 = _T1_P1_SAVE * 1
    input2 = _T1_P2_SAVE * 2
    input3 = _T1_P3_SAVE * 3
    output = _T1_SAVE_PRESET

# Select which notes from the current scale should be played
[buttongroup]
    select = _SELECTED_TRACK
    selectat = 1
    minactive = 1
    maxactive = _CONTROL * -6 + 7
    startbutton = -1
    button1 = B1.1
    led1 = L1.1
    buttonoutput1 = _T1_SEL_1
    button2 = B1.2
    led2 = L1.2
    buttonoutput2 = _T1_SEL_2
    button3 = B1.3
    led3 = L1.3
    buttonoutput3 = _T1_SEL_3
    button4 = B1.4
    led4 = L1.4
    buttonoutput4 = _T1_SEL_4
    button5 = B1.5
    led5 = L1.5
    buttonoutput5 = _T1_SEL_5
    button6 = B1.6
    led6 = L1.6
    buttonoutput6 = _T1_SEL_6
    button7 = B1.7
    led7 = L1.7
    buttonoutput7 = _T1_SEL_7

# Clock divider for track 1
[clocktool]
    clock = _CLOCK
    reset = _RESET
    divide = _T1_CD_EVEN_DIV * _T1_CD_ODD_DIV
    multiply = _T1_CD_EVEN_MULT * _T1_CD_ODD_MULT
    output = _T1_CLOCK

# Mix global and per-track diatonic transposition
[mixer]
    input1 = _T1_NOTESHIFT_CLOCKED
    input2 = _GLOBAL_NOTESHIFT_CLOCKED
    output = _T1_NOTESHIFT_SUM

# The clear range logic should just affect the current track
[ifequal]
    input1 = _SELECTED_TRACK * _RANGE
    input2 = 1
    ifequal = 1
    output = _T1_CLEAR_RANGE

# Collect different sources of resetting the start/end point
[logic]
    input1 = _T1_CLEAR + _T1_PEACE
    input2 = _T1_CLEAR_RANGE * _CONTROL
    or = _T1_CLEARSTARTEND

# Select encoder if track 1 is selected, arp is off and control is not held
[logic]
    input1 = _T1_SELECTED * _NO_CONTROL
    input2 = _T1_ARP_OFF
    and = _T1_ENC_1_SELECTED

# Note shift for each step repetition
[encoder]
    select = _T1_ENC_1_SELECTED
    encoder = 1
    header = "Repeat shift"
    color = 0.6
    discrete = 15
    startvalue = 7
    outputoffset = -7
    output = _T1_REPEATSHIFT

# Select encoder if track 1 is selected, arp is off and control is held
[logic]
    input1 = _T1_SELECTED * _CONTROL
    input2 = _T1_ARP_OFF
    and = _T1_ENC_2_SELECTED

# Note shift for each ratchet
[encoder]
    select = _T1_ENC_2_SELECTED
    encoder = 1
    header = "Ratchet shift"
    color = 0.8
    discrete = 15
    startvalue = 7
    outputoffset = -7
    output = _T1_RATCHETSHIFT

# Sequencer for pitch and gate of track 1
[motoquencer]
    select = _GLOBAL_FADER_SELECTION
    selectat = 1
    page = _PAGE
    stepcopy = _T1_COPY_BUTTON
    doublerange = _T1_COPY_BUTTON
    loadpreset = _T1_LOAD_PRESET
    savepreset = _T1_SAVE_PRESET
    clear = _T1_CLEAR
    select1 = _T1_SEL_1 + _T1_12TONE
    select3 = _T1_SEL_2 + _T1_12TONE
    select5 = _T1_SEL_3 + _T1_12TONE
    select7 = _T1_SEL_4 + _T1_12TONE
    select9 = _T1_SEL_5 + _T1_12TONE
    select11 = _T1_SEL_6 + _T1_12TONE
    select13 = _T1_SEL_7 + _T1_12TONE
    selectfill1 = _T1_12TONE
    selectfill2 = _T1_12TONE
    selectfill3 = _T1_12TONE
    selectfill4 = _T1_12TONE
    selectfill5 = _T1_12TONE
    degree = _DEGREE
    clock = _T1_CLOCK * _RUNNING
    taptempo = _T1_CLOCK
    reset = _RESET + _T1_RESET
    cv = _T1_PITCH
    cvrange = _T1_CVRANGE * 1V
    defaultgate = 0
    gate = _T1_SEQUENCER_GATE
    numfaders = 8
    numsteps = 16
    linktonext = 1
    autoreset = _T1_AUTORESET
    shiftsteps = _T1_SHIFTSTEPS
    pattern = -1 * 2 + _T1_PATTERN_FADER
    direction = _T1_DIRECTION
    pingpong = _T1_PINGPONG
    selectnoteshift = _T1_NOTESHIFT_SUM
    tuningmode = _TUNINGMODE
    tuningpitch = 1V
    bulkedit = _CONTROL
    constantlength = B2.18
    accumulatorrange = _T1_ACCU_RANGE
    root = _ROOT * _T1_TBR_OFF
    transpose = _T1_TBR
    luckybuttons = _T1_LUCKY * _CONTROL
    luckyfaders = _T1_LUCKY * _NO_CONTROL
    luckychance = 1 / 8
    luckyamount = 0.5 * _NO_CONTROL + 0.5
    luckyscope = 3
    fadermode = _FADERMODE
    mute = -1 * _RUNNING + 1
    form = _T1_FORM
    invert = _T1_INVERT
    gatelength = _T1_GATELENGTH
    buttonmode = _BUTTONMODE
    composemode = _COMPOSEMODE
    clearskips = _T1_CLEAR + _T1_PEACE
    clearrepeats = _T1_CLEAR + _T1_PEACE
    clearstartend = _T1_CLEARSTARTEND
    repeatshift = _T1_REPEATSHIFT
    ratchetshift = _T1_RATCHETSHIFT
    startofsequence = _T1_START_OF_SEQUENCE

# Sequencer for velocity
[motoquencer]
    select = _GLOBAL_FADER_SELECTION
    selectat = 1
    page = _PAGE
    stepcopy = _T1_COPY_BUTTON
    doublerange = _T1_COPY_BUTTON
    clear = _T1_CLEAR
    loadpreset = _T1_LOAD_PRESET
    savepreset = _T1_SAVE_PRESET
    cv = _T1_VELOCITY
    defaultcv = 5.5V
    cvbase = 1V
    cvrange = 9V
    quantize = 0
    cvname = "Velocity"
    bulkedit = _CONTROL
    linktonext = 1

# Copy velocity to CV output
[copy]
    input = _T1_VELOCITY
    output = O2

# Sequencer for gate length and glide
[motoquencer]
    select = _GLOBAL_FADER_SELECTION
    selectat = 1
    page = _PAGE
    stepcopy = _T1_COPY_BUTTON
    doublerange = _T1_COPY_BUTTON
    clear = _T1_CLEAR
    loadpreset = _T1_LOAD_PRESET
    savepreset = _T1_SAVE_PRESET
    cv = _T1_GATELENGTH
    cvbase = 0.05
    cvrange = 0.9
    defaultcv = 0.5
    defaultgate = 0
    quantize = 0
    buttoncolor = 0.5
    cvname = "Gate length"
    bulkedit = _CONTROL
    linktonext = 1
    gate = _T1_GLIDE
    gatename = "Glide"

# Sequencer for activity level per step
[motoquencer]
    select = _GLOBAL_FADER_SELECTION
    selectat = 1
    clear = _T1_CLEAR
    loadpreset = _T1_LOAD_PRESET
    savepreset = _T1_SAVE_PRESET
    cv = _T1_STEP_ACTIVITY
    quantize = 0
    defaultcv = 7
    cvname = "Activity"
    cvnotches = 8
    bulkedit = _CONTROL

# Silence the gate if the step does not reach the required activity
[compare]
    input = _T1_STEP_ACTIVITY
    compare = _T1_ACTIVITY
    ifless = 0
    else = _T1_SEQUENCER_GATE
    output = _T1_ACT_GATE

# Modulate gate length for gate output in arpeggiator mode
[gatetool]
    taptempo = _T1_ARP_TAPTEMPO
    gatelength = _T1_GATELENGTH
    inputgate = _T1_ARP_CLOCK
    outputgate = _T1_ARP_MODULATED_GATE

# Switch gate to arpeggiator if active
[ifequal]
    input1 = _T1_ARP_SYNCED
    input2 = 0
    ifequal = _T1_ACT_GATE
    else = _T1_ARP_MODULATED_GATE
    output = _T1_SWITCHED_GATE

# Logic for make the gate silent if the track is muted
[logic]
    input1 = -1 * _T1_MUTED + 1
    input2 = _T1_SWITCHED_GATE
    and = _T1_MUTED_GATE

# Select clock for arpeggiator of track 1. It is either the master clock or a multiplication
# of it, or the sequencer gate output.
[switch]
    input1 = _CLOCK
    input2 = _T1_SEQUENCER_GATE
    input3 = _CLOCK_3_2
    input4 = _CLOCK_2_1
    input5 = _CLOCK_3_1
    input6 = _CLOCK_4_1
    input7 = _CLOCK_6_1
    input8 = _CLOCK_8_1
    output1 = _T1_ARP_CLOCK
    offset = _T1_ARP_CLOCKING

# Create taptempo for arp clock to be used for gate length
[switch]
    input1 = _CLOCK
    input2 = _T1_CLOCK
    input3 = _CLOCK_3_2
    input4 = _CLOCK_2_1
    input5 = _CLOCK_3_1
    input6 = _CLOCK_4_1
    input7 = _CLOCK_6_1
    input8 = _CLOCK_8_1
    output1 = _T1_ARP_TAPTEMPO
    offset = _T1_ARP_CLOCKING * _T1_ARP

# Select encoder if track 1 is selected, arp is on and control is not held
[logic]
    input1 = _T1_SELECTED * _NO_CONTROL
    input2 = _T1_ARP
    and = _T1_ENC_3_SELECTED

# Encoder for base pitch of arpeggiator
[encoder]
    encoder = 1
    select = _T1_ENC_3_SELECTED
    header = "Arp base pitch"
    color = 0.2
    discrete = 37
    sensivity = 3
    output = _T1_ARP_PITCH

# Select encoder if track 1 is selected, arp is on and control is held
[logic]
    input1 = _T1_SELECTED * _CONTROL
    input2 = _T1_ARP
    and = _T1_ENC_4_SELECTED

# Encoder for pitch range of arpeggiator
[encoder]
    encoder = 1
    select = _T1_ENC_4_SELECTED
    header = "Arp pitch range"
    color = 0.4
    discrete = 49
    startvalue = 24
    sensivity = 4
    output = _T1_ARP_RANGE

# Arpeggiator for track 1
[arpeggio]
    select1 = _T1_SEL_1
    select3 = _T1_SEL_2
    select5 = _T1_SEL_3
    select7 = _T1_SEL_4
    select9 = _T1_SEL_5
    select11 = _T1_SEL_6
    select13 = _T1_SEL_7
    selectfill1 = 0
    selectfill2 = 0
    selectfill3 = 0
    selectfill4 = 0
    selectfill5 = 0
    root = _ROOT * _T1_TBR_OFF
    transpose = _T1_TBR
    degree = _DEGREE
    clock = _T1_ARP_CLOCK * _RUNNING
    reset = _RESET
    tuningmode = _TUNINGMODE
    direction = _T1_ARP_UPDOWN
    pingpong = _T1_ARP_PINGPONG
    butterfly = _T1_ARP_BUTTERFLY
    octaves = _T1_ARP_OCTAVING
    drop = _T1_ARP_DROP
    pattern = _T1_ARP_PATTERN
    autoreset = _T1_ARP_AUTORESET
    pitch = _T1_ARP_PITCH / 120
    range = _T1_ARP_RANGE / 120
    output = _T1_ARP_OUTPUT

# Switch pitch output between sequencer and arpeggiator
[ifequal]
    input1 = _T1_ARP_SYNCED
    input2 = 0
    ifequal = _T1_PITCH
    else = _T1_ARP_OUTPUT + _T1_ARP_OCTAVE
    output = _T1_SWITCHED_PITCH

# Mix all sources of pitch together
[mixer]
    input1 = _T1_OCTAVE * 1V - 2V
    input2 = _T1_SWITCHED_PITCH
    input3 = _GLOBAL_OCTAVE_SWITCH * 1V - 2V
    input4 = _GLOBAL_TRANSPOSITION * 0.00833333
    output = _T1_FINAL_PITCH

# Slew limiter for glides
[slew]
    input = _T1_FINAL_PITCH
    exponential = O1
    slew = _T1_GLIDE * _T1_GLIDE_LENGTH

# If we are in compose mode and the arpeggiator is switched off, the gate is output even if
# the sequencer is stopped.
[ifequal]
    input1 = _T1_ARP
    input2 = 0
    ifequal = _RUNNING + _COMPOSEMODE
    else = _RUNNING
    output = _RUNNING_OR_COMPOSE_1

# Copy the gate to its final destination
[copy]
    input = _T1_MUTED_GATE * _RUNNING_OR_COMPOSE_1
    output = _T1_FINAL_GATE

# Copy the gate signal to the CV jack
[copy]
    input = _T1_FINAL_GATE
    output = G1.1

# Names for the display
[switch]
    input1 = "a"
    input2 = "a a a c"
    input3 = "a a c c"
    offset = _T1_FORM
    output1 = _T1_FORM_NAME

# Display the name of 'Song form' when edited
[display]
    linger = 0.1
    header = "SONG FORM"
    text = _T1_FORM_NAME
    fontsize = 4

# Names for the display
[ifequal]
    input1 = _T1_12TONE
    input2 = 0
    ifequal = "diatonic"
    else = "chromatic"
    output = _T1_12TONE_NAME

# Display the name of 'Scale' when edited
[display]
    linger = 0.1
    header = "SCALE"
    text = _T1_12TONE_NAME
    fontsize = 2

# Show a message when _T1_CLEARSTARTEND triggers
[display]
    trigger = _T1_CLEARSTARTEND
    text = "Reset start/end"

# Show a message when _T1_PEACE triggers
[display]
    trigger = _T1_PEACE
    text = "Track 1 peace"

# Show a message when _T1_CLEAR triggers
[display]
    trigger = _T1_CLEAR
    text = "Track 1 cleared"

# Names for the display
[ifequal]
    input1 = _T1_ARP
    input2 = 0
    ifequal = "Sequencer"
    else = "Arpeggiator"
    output = _T1_ARP_NAME

# Display the name of '' when edited
[display]
    linger = 0.1
    header = ""
    text = _T1_ARP_NAME
    fontsize = 2

# -------------------------------------------------
# Track 2
# -------------------------------------------------

# Provide trigger when the clear button is pressed (no Ctrl needed)
[button]
    select = _SELECTED_TRACK
    selectat = 2
    button = B2.4
    shortpress = _T2_CLEAR_BUTTON
    states = 1

# Clear button with control together clears the track
[copy]
    input = _T2_CLEAR_BUTTON * _CONTROL
    output = _T2_CLEAR

# Clear button without control removes all mode that alter the pattern length
[logic]
    input1 = _T2_CLEAR_BUTTON
    input2 = -1 * _CONTROL + 1
    and = _T2_PEACE

# Five blinks for the clear LED
[burst]
    trigger = _T2_CLEAR + _FACTORY_RESET
    hz = 5
    count = 5
    output = _T2_CLEAR_LED

# LED only blinks when track is selected
[select]
    select = _SELECTED_TRACK
    selectat = 2
    input = _T2_CLEAR_LED + 0.3
    output = L2.4

# Reset track immediately
[button]
    select = _SELECTED_TRACK
    selectat = 2
    button = B2.11 * _NO_CONTROL
    states = 1
    output = _T2_RESET

# Show a message when _T2_RESET triggers
[display]
    trigger = _T2_RESET
    text = "Reset track 2"

# Button for copy and paste
[button]
    select = _SELECTED_TRACK
    selectat = 2
    button = B2.24
    states = 1
    output = _T2_COPY_BUTTON

# This button cycles between the song froms A, AAAB and AABB
[button]
    select = _SELECTED_TRACK
