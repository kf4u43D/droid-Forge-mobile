    led4 = _SOLO_LD
    led5 = _SOLO_OR
    led6 = _SOLO_AR
    led7 = _SOLO_EFFECTS
    led8 = _SOLO_LB
    led9 = _SOLO_CH
    led10 = _SOLO_DR
    led11 = _SOLO_BD
    led12 = _SOLO_REVERB

