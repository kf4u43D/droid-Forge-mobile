# -------------------------------------------------
# Fireface MIDI driver
# Output numbers (Stereo outs use two numbers)
# 1: Main
# 3: Magneto
# 5: Starlab
# 7: Z-DSP
# 9: Phones
# 11: Reverb (Bricasti)
# 
# Input numbers (Stereo inputs use two numbers)
# 1: Effects
# 3: LB: Low bass
# 4: BD: Bass drum
# 5: Drums
# 7: Chords
# 9: TB: Tenor bass
# 10: LD: Lead voice
# 11: OR: Ornamental voice
# 12: AR: Arpeggio voice
# 13: Reverb (Bricasti)
# -------------------------------------------------

[copy]
    input = B1.12
    output = _FORCE_UPDATE

[lfo]
    hz = 1
    level = 1 / 126
    square = _FEEDBACK_AVOID_LFO

[firefacecontrol]
    outputlevel1 = _OUTPUT_MAIN * _FADE_LEVEL
    outputlevel3 = _OUTPUT_MAGNETO
    outputlevel5 = _OUTPUT_STARLAB
    outputlevel7 = _OUTPUT_ZDSP
    outputlevel9 = _OUTPUT_PHONES
    outputlevel11 = _OUTPUT_REVERB
    outputmix1in1 = _VOLUME_EFFECTS
    outputmix1in3 = _VOLUME_LB
    outputmix1in4 = _GAIN_INPUT_BD * _MAIN_INPUT_BD
    outputmix1in5 = _GAIN_INPUT_DR * _MAIN_INPUT_DR
    outputmix1in7 = _VOLUME_CH
    outputmix1in9 = _VOLUME_TB
    outputmix1in10 = _GAIN_INPUT_LD * _MAIN_INPUT_LD
    outputmix1in11 = _GAIN_INPUT_OR * _MAIN_INPUT_OR
    outputmix1in12 = _GAIN_INPUT_AR * _MAIN_INPUT_AR
    outputmix1in13 = _VOLUME_REVERB
    outputmix3in1 = 0
    outputmix3in3 = _MAGNETO_INPUT_LB
    outputmix3in4 = _MAGNETO_INPUT_BD
    outputmix3in5 = _MAGNETO_INPUT_DR
    outputmix3in7 = _MAGNETO_INPUT_CH
    outputmix3in9 = _MAGNETO_INPUT_TB
    outputmix3in10 = _MAGNETO_INPUT_LD
    outputmix3in11 = _MAGNETO_INPUT_OR
    outputmix3in12 = _MAGNETO_INPUT_AR
    outputmix3in13 = _FEEDBACK_AVOID_LFO
    outputmix5in1 = 0
    outputmix5in3 = _STARLAB_INPUT_LB
    outputmix5in4 = _STARLAB_INPUT_BD
    outputmix5in5 = _STARLAB_INPUT_DR
    outputmix5in7 = _STARLAB_INPUT_CH
    outputmix5in9 = _STARLAB_INPUT_TB
    outputmix5in10 = _STARLAB_INPUT_LD
    outputmix5in11 = _STARLAB_INPUT_OR
    outputmix5in12 = _STARLAB_INPUT_AR
    outputmix5in13 = _FEEDBACK_AVOID_LFO
    outputmix7in3 = _PHASER_INPUT_LB
    outputmix7in4 = _PHASER_INPUT_BD
    outputmix7in5 = _PHASER_INPUT_DR
    outputmix7in7 = _PHASER_INPUT_CH
    outputmix7in9 = _PHASER_INPUT_TB
    outputmix7in10 = _PHASER_INPUT_LD
    outputmix7in11 = _PHASER_INPUT_OR
    outputmix7in12 = _PHASER_INPUT_AR
    outputmix9in1 = _PHONES_INPUT_EFFECTS
    outputmix9in3 = _GAIN_INPUT_LB * _PHONES_INPUT_LB
    outputmix9in4 = _GAIN_INPUT_DR * _PHONES_INPUT_BD
    outputmix9in5 = _GAIN_INPUT_BD * _PHONES_INPUT_DR
    outputmix9in7 = _GAIN_INPUT_CH * _PHONES_INPUT_CH
    outputmix9in9 = _GAIN_INPUT_TB * _PHONES_INPUT_TB
    outputmix9in10 = _GAIN_INPUT_LD * _PHONES_INPUT_LD
    outputmix9in11 = _GAIN_INPUT_OR * _PHONES_INPUT_OR
    outputmix9in12 = _GAIN_INPUT_AR * _PHONES_INPUT_AR
    outputmix9in13 = _PHONES_INPUT_REVERB
    outputmix11in1 = _REVERB_INPUT_EFFECTS
    outputmix11in3 = _REVERB_INPUT_LB
    outputmix11in4 = _REVERB_INPUT_BD
    outputmix11in5 = _REVERB_INPUT_DR
    outputmix11in7 = _REVERB_INPUT_CH
    outputmix11in9 = _REVERB_INPUT_TB
    outputmix11in10 = _REVERB_INPUT_LD
    outputmix11in11 = _REVERB_INPUT_OR
    outputmix11in12 = _REVERB_INPUT_AR
    outputmix11in13 = _FEEDBACK_AVOID_LFO
    phonesoutput1 = 9
    postfader3 = -1 * _POSTFADER_INPUT_LB + 1
    postfader4 = -1 * _POSTFADER_INPUT_BD + 1
    postfader5 = -1 * _POSTFADER_INPUT_DR + 1
    postfader7 = -1 * _POSTFADER_INPUT_CH + 1
    postfader9 = -1 * _POSTFADER_INPUT_TB + 1
    postfader10 = -1 * _POSTFADER_INPUT_LD + 1
    postfader11 = -1 * _POSTFADER_INPUT_OR + 1
    postfader12 = -1 * _POSTFADER_INPUT_AR + 1
    unmute1 = _UNMUTE_EFFECTS
    unmute3 = _UNMUTE_LB
    unmute4 = _UNMUTE_BD
    unmute5 = _UNMUTE_DR
    unmute7 = _UNMUTE_CH
    unmute9 = _UNMUTE_TB
    unmute10 = _UNMUTE_LD
    unmute11 = _UNMUTE_OR
    unmute12 = _UNMUTE_AR
    unmute13 = _UNMUTE_REVERB
    update = _FORCE_UPDATE

# -------------------------------------------------
# Tuner
# -------------------------------------------------

[vcotuner]
    tuningnote = 0
    ledflat = _FLAT
    ledsharp = _SHARP
    intune = _INTUNE
    vcofound = _VCOFOUND

[copy]
    input = _VCOFOUND * -1 + 1
    output = _NO_VCO_FOUND

[select]
    input = _FLAT
    select = _VCOFOUND
    output = L2.1

[select]
    input = 0.8
    select = _VCOFOUND
    output = R2.1

[select]
    input = _INTUNE
    select = _VCOFOUND
    output = L2.2

[select]
    input = 0.4
    select = _VCOFOUND
    output = R2.2

[select]
    input = _SHARP
    select = _VCOFOUND
    output = L2.3

[select]
    input = 0.8
    select = _VCOFOUND
    output = R2.3

# -------------------------------------------------
# LEDs in mixing mode
# -------------------------------------------------

[mixer]
    input1 = L1.1
    input2 = L1.3
    input3 = L1.17
    input4 = L1.18
    input5 = L1.19
    input6 = L1.20
    output = _SOME_MIX

[copy]
    input = _NO_VCO_FOUND * _SOME_MIX
    output = _MIXING_MODE

[select]
    input = L1.21
    output = L2.1
    select = _MIXING_MODE

[select]
    input = 1.2
    output = R2.1
    select = _MIXING_MODE

[select]
    input = L1.22 + 0.1
    output = L2.2
    select = _MIXING_MODE

[select]
    input = 0.4
    output = R2.2
    select = _MIXING_MODE

[select]
    input = L1.23 + 0.1
    output = L2.3
    select = _MIXING_MODE

[select]
    input = 0.6
    output = R2.3
    select = _MIXING_MODE

[select]
    input = L1.24 + 0.1
    output = L2.4
    select = _MIXING_MODE

[select]
    input = 0.8
    output = R2.4
    select = _MIXING_MODE

[select]
    input = L1.25 + 0.1
    output = L3.1
    select = _MIXING_MODE

[select]
    input = 1.05
    output = R3.1
    select = _MIXING_MODE

[select]
    input = L1.26 + 0.1
    output = L3.2
    select = _MIXING_MODE

[select]
    input = 0.1
    output = R3.2
    select = _MIXING_MODE

[select]
    input = L1.27 * 0.9 + 0.1
    output = L3.3
    select = _MIXING_MODE

[select]
    input = 0.7
    output = R3.3
    select = _MIXING_MODE

[select]
    input = L1.28 * 0.9 + 0.1
    output = L3.4
    select = _MIXING_MODE

[select]
    input = 0.7
    output = R3.4
    select = _MIXING_MODE

# -------------------------------------------------
# LEDs in other modes
# -------------------------------------------------

[logic]
    input1 = _NO_VCO_FOUND
    input2 = _MIXING_MODE * -1 + 1
    and = _OTHER_MODE

[select]
    input = 0
    output = L2.1
    select = _OTHER_MODE

[select]
    input = 0
    output = L2.2
    select = _OTHER_MODE

[select]
    input = 0
    output = L2.3
    select = _OTHER_MODE

[select]
    input = 0
    output = L2.4
    select = _OTHER_MODE

[select]
    input = 0
    output = L3.1
    select = _OTHER_MODE

[select]
    input = 0
    output = L3.2
    select = _OTHER_MODE

[select]
    input = 0
    output = L3.3
    select = _OTHER_MODE

[select]
    input = 0
    output = L3.4
    select = _OTHER_MODE
