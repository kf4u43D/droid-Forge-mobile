# -------------------------------------------------
# Calibration of gain via B1.11
# -------------------------------------------------

[copy]
    input = B1.5
    output = _GAIN_RESET

[copy]
    input = 0.7
    output = _NORM_LEVEL

[math]
    input1 = _GAIN_INPUT_TB * _MAIN_INPUT_TB
    input2 = _NORM_LEVEL
    quotient = _CALIBRATE_TB

[math]
    input1 = _GAIN_INPUT_LD * _MAIN_INPUT_LD
    input2 = _NORM_LEVEL
    quotient = _CALIBRATE_LD

[math]
