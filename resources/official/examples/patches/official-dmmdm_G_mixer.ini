    led = L1.10
    states = 1
    output = _MUTE_ALL

# Hidden buttongroup for selecting solo voice (uses the same
# buttons as the fader mode. That is indendet).
[buttongroup]
    select = _NO_MUTE_MODE
    button3 = B1.21 # 2: TB
    button4 = B1.22 # 3: LD
    button5 = B1.23 # 4: OR
    button6 = B1.24 # 5: AR
    button7 = B1.29 # 6: Effects
    button8 = B1.25 # 7: LB
    button9 = B1.26 # 8: Chords
    button10 = B1.27 # 9: Drums
    button11 = B1.28 # 10: BD
    button12 = B1.30 # 11: Reverb
