# (G) Mixer
# LABELS: master=18

# 

# INPUTS:
#  I2: [Duck]
#  I3: [Duck]

# CONTROLLER 1:
#  B1.1: [Mix] Main mixer
#  B1.2: [Out] Output mix
#  B1.3: [Headph] Headphone mix
#  B1.4: [Ducking]
#  B1.5: [Level out] Level out main mix
#  B1.7: [Load] Load preset
#  B1.8: [Save] Save preset
#  B1.9: [Fade] Fade in / out master
#  B1.10: [Mute all]
#  B1.11: [Mute Duck]
#  B1.12: [Refresh] Resend all MIDI CCs
#  B1.17: [MAG] All voices to Magneto
#  B1.18: [STA] All voices to Starlab
#  B1.19: [PHA] All voices to Phaser
#  B1.20: [REV] All voices to Reverb
#  B1.21: [TB] Tenor bass
#  B1.22: [LD] Lead voice
#  B1.23: [OR] Ornament voice
#  B1.24: [AR] Arpeggio voice
#  B1.25: [LB] Low bass
#  B1.26: [CH] Chords
#  B1.27: [DR] Hi-Drums
#  B1.28: [BD] Bass drumm
#  B1.29: [Effects]
#  B1.30: [Reverb]
#  B1.31: [SOLO] Solo current voice
#  B1.32: [MUTE]

[b32]
[m4]
[m4]

# -------------------------------------------------
# Fader mode
# -------------------------------------------------

[buttongroup]
    button1 = B1.1 # 0: Mix
    button2 = B1.2 # 1: Output
    button3 = B1.21 # 2: TB
    button4 = B1.22 # 3: LD
    button5 = B1.23 # 4: OR
    button6 = B1.24 # 5: AR
    button7 = B1.29 # 6: Effects
    button8 = B1.25 # 7: LB
    button9 = B1.26 # 8: Chords
    button10 = B1.27 # 9: Drums
    button11 = B1.28 # 10: BD
    button12 = B1.30 # 11: Reverb
    button13 = B1.4 # Ducking
    button14 = 0 # 13: LFO Bank (2)
    button15 = B1.3 # Phone mix
    button16 = B1.17 # Phone mix
    button17 = B1.18 # Phone mix
    button18 = B1.19 # Phone mix
    button19 = B1.20 # Phone mix
    select = _NO_MUTE_MODE
    buttonoutput13 = _FADERMODE_DUCKING
    extrapress = _VOICE_EXTRA_PRESS
    led1 = L1.1
    led2 = L1.2
    led3 = _TB_SELECTED
    led4 = _LD_SELECTED
    led5 = _OR_SELECTED
    led6 = _AR_SELECTED
    led7 = _EFFECTS_SELECTED
    led8 = _LB_SELECTED
    led9 = _CH_SELECTED
    led10 = _DR_SELECTED
    led11 = _BD_SELECTED
    led12 = _REVERB_SELECTED
#   led13 = L1.4
    led15 = L1.3
    led16 = L1.17
    led17 = L1.18
    led18 = L1.19
    led19 = L1.20
    output = _FADERMODE

[gatetool]
    inputgate = _VOICE_EXTRA_PRESS
    outputgate = _MUTE_EXTRA_BUTTON
    gatelength = 0.1

[lfo]
    hz = 4
    level = 1
    square = _MUTED_LFO

# Signal current state of channel in the following way:
#
# 1. not selected, not muted -> 0.3
# 2. not selected, muted -> blink (between 0.0 and 0.3)
# 3. selected, not muted -> steady (1.0)
# 4. selected, muted -> blink (between 0 and 1)
[switch]
    input1 = _MUTED_LFO * 0.3
    input2 = 0.3
    input3 = _MUTED_LFO * 1
    input4 = 1
    offset = _TB_SELECTED * 2 + _UNMUTE_TB
    output1 = L1.21

[switch]
    input1 = _MUTED_LFO * 0.3
    input2 = 0.3
    input3 = _MUTED_LFO * 1
    input4 = 1
    offset = _LB_SELECTED * 2 + _UNMUTE_LB
    output1 = L1.25

[switch]
    input1 = _MUTED_LFO * 0.3
    input2 = 0.3
    input3 = _MUTED_LFO * 1
    input4 = 1
    offset = _LD_SELECTED * 2 + _UNMUTE_LD
    output1 = L1.22

[switch]
    input1 = _MUTED_LFO * 0.3
    input2 = 0.3
    input3 = _MUTED_LFO * 1
    input4 = 1
    offset = _CH_SELECTED * 2 + _UNMUTE_CH
    output1 = L1.26

[switch]
    input1 = _MUTED_LFO * 0.3
    input2 = 0.3
    input3 = _MUTED_LFO * 1
    input4 = 1
    offset = _OR_SELECTED * 2 + _UNMUTE_OR
    output1 = L1.23

[switch]
