# -------------------------------------------------
# Ducking
# -------------------------------------------------

[button]
    button = B1.11
    led = L1.11
    inverted = _DUCKING_UNMUTED

[faderbank]
    firstfader = 1
    select = _FADERMODE_DUCKING
    output1 = _DUCK_HOLD
    output2 = _DUCK_RELEASE
    output3 = _DUCK_SHAPE

[contour]
    trigger = I2 * _DUCKING_UNMUTED
    attack = 0
    release = _DUCK_RELEASE * 0.3
    hold = _DUCK_HOLD
    shape = _DUCK_SHAPE
    output = _DUCKING
    level = -1

# The second M4 controls the amount of ducking for four different output channels.
[faderbank]
    select = _FADERMODE_DUCKING
    firstfader = 5
    output1 = _DUCK_BASS
    output2 = _DUCH_CH
    output3 = _DUCK_EFFECTS
    output4 = _DUCK_REVERB

[math]
    input1 = _GAIN_INPUT_TB * _MAIN_INPUT_TB
    input2 = _DUCK_BASS * _DUCKING + 1
    product = _VOLUME_TB

[math]
    input1 = _GAIN_INPUT_LB * _MAIN_INPUT_LB
    input2 = _DUCK_BASS * _DUCKING + 1
    product = _VOLUME_LB

[math]
    input1 = _GAIN_INPUT_CH * _MAIN_INPUT_CH
    input2 = _DUCH_CH * _DUCKING + 1
    product = _VOLUME_CH

[math]
    input1 = _MAIN_INPUT_REVERB
    input2 = _DUCK_REVERB * _DUCKING + 1
    product = _VOLUME_REVERB

[math]
    input1 = _MAIN_INPUT_EFFECTS
    input2 = _DUCK_EFFECTS * _DUCKING + 1
    product = _VOLUME_EFFECTS

[copy]
    input = _DUCKING
    output = L1.4

